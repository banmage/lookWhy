# =====================================================================
# GB/T 1.1-2020 结构化规则文档 — 标准化文件的内容、结构与排版要求
# =====================================================================
# 来源：《标准化工作导则 第1部分：标准化文件的结构和起草规则》
#       （GB/T 1.1-2020，含规范性附录 E、F）
# 用途：lookWhy 流水线（抽取 → CSM → SSIR → PDF 渲染）中每条处理与验证
#       的规则依据。规则 ID 前缀 GBT-；源码中以 "GBT-xxx" 注释引用。
# 结构：content-and-structure 内容与结构要求；layout 排版要求（位置/格式/
#       字体字号）。每条规则的 source 字段给出标准原文的章节编号以便追溯。
# =====================================================================

meta:
  standard: "GB/T 1.1-2020"
  title: "标准化工作导则 第1部分：标准化文件的结构和起草规则"
  version: "1.0.0"
  note: >-
    priority 采用 GB/T 措辞分级：must=应（要求型条款）、should=宜（推荐型）、
    may=可（允许型）。凡标注 must 的规则在机器验证中违规即失败。

content-and-structure:

  elements:
    - {id: GBT-E01, element: 封面, required: 必备, kind: 资料性, order: 1,
       allowed-forms: [标明文件信息], source: "表3"}
    - {id: GBT-E02, element: 目次, required: 可选, kind: 资料性, order: 2,
       allowed-forms: [列表(自动生成)], source: "表3"}
    - {id: GBT-E03, element: 前言, required: 必备, kind: 资料性, order: 3,
       allowed-forms: [条文, 注, 脚注, 指明附录], source: "表3"}
    - {id: GBT-E04, element: 引言, required: 可选, kind: 资料性, order: 4,
       allowed-forms: [条文, 图, 表, 数学公式, 注, 脚注, 指明附录], source: "表3"}
    - {id: GBT-E05, element: 范围, required: 必备, kind: 规范性, order: 5,
       allowed-forms: [条文, 表, 注, 脚注], source: "表3"}
    - {id: GBT-E06, element: 规范性引用文件, required: 必备/可选, kind: 资料性, order: 6,
       allowed-forms: [清单, 注, 脚注], source: "表3"}
    - {id: GBT-E07, element: 术语和定义, required: 必备/可选, kind: 规范性, order: 7,
       allowed-forms: [条文, 图, 数学公式, 示例, 注, 引用, 提示], source: "表3"}
    - {id: GBT-E08, element: 符号和缩略语, required: 可选, kind: 规范性, order: 8,
       allowed-forms: [条文, 图, 表, 数学公式, 示例, 注, 脚注, 引用, 提示, 指明附录], source: "表3"}
    - {id: GBT-E09, element: 分类和编码/系统构成, required: 可选, kind: 规范性, order: 9, source: "表3"}
    - {id: GBT-E10, element: 总体原则和/或总体要求, required: 可选, kind: 规范性, order: 10, source: "表3"}
    - {id: GBT-E11, element: 核心技术要素, required: 必备, kind: 规范性, order: 11,
       source: "表3、8.11"}
    - {id: GBT-E12, element: 其他技术要素, required: 可选, kind: 规范性, order: 12,
       source: "表3、8.12"}
    - {id: GBT-E13, element: 参考文献, required: 可选, kind: 资料性, order: 13,
       allowed-forms: [清单, 脚注], source: "表3"}
    - {id: GBT-E14, element: 索引, required: 可选, kind: 资料性, order: 14,
       allowed-forms: [列表(自动生成)], source: "表3"}

  hierarchy:
    - id: GBT-H01
      rule: 部分编号：同一标准各部分用文件编号中的顺序号区分（如 GB/T ×××××.1）。
      source: "7.1.2"
    - id: GBT-H02
      rule: 章：从"范围"一章开始用阿拉伯数字连续编号，直到附录之前；每一章均应有章标题，置于编号之后。
      source: "7.2"
    - id: GBT-H03
      rule: 条：章内细分层次用点分阿拉伯数字编号（如 10.1.2）；条号必须以父号加点为前缀（4.2.1 挂于 4.2 之下）；最多分到第五层次；一个层次中有一个以上的条时才可设条。
      source: "7.3.1、7.3.2"
    - id: GBT-H04
      rule: 第一层次的条宜给出条标题并置于编号之后；同层次各条有无标题应一致；无标题条的首句可用黑体突出关键术语；无标题条不应再分条。
      source: "7.3.3、7.3.4"
    - id: GBT-H05
      rule: 段：章或条内无编号的细分层次；不宜设悬置段（章标题与条之间、条标题与下一层次条之间的段）。
      source: "7.4"
    - id: GBT-H06
      rule: 列项：由引语引出；第一层次项前用破折号（—）、间隔号（·）或字母编号 a)、b)，第二层次用间隔号或数字编号 1)、2)；列项细分不宜超过两个层次；最后一项以句号结束。
      source: "7.5.1—7.5.4"

  element-authoring:
    - id: GBT-C01
      rule: 封面必备信息：文件名称、文件层次/类别字样、文件代号、文件编号、ICS 号、CCS 号、发布日期、实施日期、发布机构；有代替文件时标明被代替文件编号（不超过一行）；与国际文件一致时标示一致性程度标识；国家标准还应标明英文名称。
      source: "8.1"
    - id: GBT-C02
      rule: 目次应依次列出：前言、引言、章、条(需要时)、附录(含性质标识)、参考文献、索引、图/表(需要时)；各项后给页码；不应列出术语条目编号和术语。
      source: "8.2"
    - id: GBT-C03
      rule: 前言为必备要素：不应包含要求/指示/推荐/允许型条款，不使用图表公式，不给章编号不分条；内容依次包括起草依据、与其他文件的关系、代替关系与主要技术变化、国际文件关系、专利说明、提出归口、起草单位与人、版本情况。
      source: "8.3"
    - id: GBT-C04
      rule: 引言为可选要素，不编号；需要给出具体技术内容产生原因等背景信息时设置。
      source: "8.4"
    - id: GBT-C05
      rule: 范围应为第 1 章：界定标准化对象与适用界限，只用陈述型条款，不含要求/指示/推荐/允许型条款；使用规定的表述句式（"本文件规定了…""本文件适用于…"等）。
      source: "8.5.1、8.5.2"
    - id: GBT-C06
      rule: 规范性引用文件应为第 2 章且不分条：由规定引导语引出文件清单；无规范性引用时写明"本文件没有规范性引用文件。"；清单不加序号；每个引用条目应含标准文件编号与文件名称（文本层损坏导致标准号丢失时提示复核）。标准号前缀识别覆盖 30+ 常见国家/行业/团体/企业代号（GB/T、GB/Z、GB、JB/T、JB、DBxx/T、QB/T、QB、SJ/T、DL/T、NY/T、HG/T、FZ/T、WS/T、YD/T、GA/T、CJ/T、JG/T、TB/T、SH/T、JC/T、EJ/T、MT/T、YY/T、YY、HJ/T、HJ、T/、Q/、ISO、IEC，长前缀优先），GB/T 等与编号间允许空格，Q/、T/ 代号后允许空白。
      source: "8.6.1—8.6.3"
    - id: GBT-C07
      rule: 术语和定义：条目必备四项——条目编号、术语、英文对应词、定义；依次可加符号、图/公式、示例、注、来源；条目不应编排成表，不准插入脚注；定义用陈述型条款；抄录条目须标明来源。
      source: "8.7.3.1—8.7.3.4"
    - id: GBT-C08
      rule: 符号和缩略语：由规定引导语引出，清单不加序号，按字母顺序排列（大写先于小写等）。
      source: "8.8.1—8.8.3"
    - id: GBT-C09
      rule: 附录：每个附录应有编号（大写拉丁字母）与性质标识 (规范性)/(资料性) 及标题；附录中不准许设置"范围""规范性引用文件""术语和定义"；附录内条、图、表、公式的编号前加附录字母（A.1、图A.1、表A.1、(A.1)）。
      source: "9.6.1—9.6.3"

  naming:
    - id: GBT-N01
      rule: 标准名称应体现功能类型（命名一致性）：术语标准名称应含"术语/定义/词汇"，方法标准应含"试验/测定/测试/校准/计算/测量/检验"等，分类标准应含"分类/编码/命名/型号"，规程标准应含"规程"，指南标准应含"指南/导则"，安全标准应含"安全"，产品标准应含"条件/规范/通则/总则/要求/限值"；否则判定"名称与功能类型不符"。
      source: "6.1.4"
    - id: GBT-N02
      rule: 标准名称应能识别出标准化主对象（主语，如"三相异步电动机试验方法"的主对象为"三相异步电动机"）；机器识别失败时应提示人工核查，不应静默通过。
      source: "6.1.4"

  expression:
    - id: GBT-X01
      rule: 图：每幅图均应有编号"图"+阿拉伯数字，从引言起连续到附录之前，与章条表编号无关；宜有图题且全文一致；转页接排需重复图编号+图题+"(续)"或"(第#页/共*页)"；单位相同时在图右上方陈述单位。
      source: "9.7.2.1—9.7.4.1"
    - id: GBT-X02
      rule: 表：每个表均应有编号"表"+阿拉伯数字，同样连续独立编号；宜有表题；不准许分表、表中套表；转页接排重复表头和单位陈述；每表应有表头，表头不准许使用斜线；单元格空缺用一字线连接号表示，不得留空格。
      source: "9.8.1.3—9.8.4"
    - id: GBT-X03
      rule: 注：属于附加信息；一个注标"注："，多个注编号"注1："起始；图中的注置于图题和图脚注之上，表中的注置于表内下方表脚注之上。
      source: "9.11.1、9.11.2"
    - id: GBT-X04
      rule: 脚注：由标记与解释成对组成；条文脚注编号 1)、2)… 从前言起全文连续，置于相关页面左下方细实线之下；**图表脚注编号用上标形式的小写拉丁字母（从 a 开始，不带半圆括号）**（标记与解释行均用小写），逐图逐表单独编号；图脚注紧跟图中注、位于图题之上；表脚注紧跟表中注、位于表内最下方。（执行侧（2026-09-24 更正）：引用点在 canonical 中写 `[foot:LABEL]`——`[foot:a]` 图表脚注、`[foot:1]` 条文脚注、`[foot:b、d]` 同格多角标（源分隔符原样）；定义写成指令对 `<!--ssir:foot:a-->注文<!--ssir:/foot-->`，紧贴表末行。**标记字面按编号族分定、判据单源 `parser.footnote_marker_text`**：数字族 → 上标 `1)`，字母族 → 上标裸小写字母 `a`（**不得补右括号**）；markdown 投影平印字面，PDF/HTML 绘成真上标。见 docs/15 §2、docs/12 §3.84、GEN-137。）
      source: "9.12.1、9.12.2"
    - id: GBT-X05
      rule: 示例：一个示例标"示例："，多个示例编号"示例1："起始；不宜单独设章条；与编排格式相关或易混淆时可置线框内。
      source: "9.10.1—9.10.4"
    - id: GBT-X06
      rule: 数学公式：另行居中编排；编号圆括号阿拉伯数字，从引言起连续到附录之前（附录内重新从 1 起并加附录字母前缀），右端对齐并与公式以"……"连接（公式与省略号之间留两个汉字间隔）；较长公式在 =、+、-、± 等符号后回行；公式之下的"式中："空两个汉字起排、单独占行，变量由字母符号代表，各项解释固定形态为「变量 + 破折号 + 解释文字 + 分号（末项句号）」，破折号前后各空四分之一汉字。编号只在需要引用或提示时要求；抽取缺号不得填补。
      source: "9.9.2、9.9.3、9.6.3、10.4.3"

layout:

  page:
    - id: GBT-P01
      rule: 幅面 A4，210mm×297mm，公差 ±1mm；特殊情况下可加宽/延长。
      source: "10.1.1"
    - id: GBT-P02
      rule: 页面格式符合附录E（图E.1—图E.12）；字号字体符合附录F（表F.1）。
      source: "10.1.2"
    - id: GBT-P03
      rule: 书眉：从目次开始，单数页书眉右侧、双数页书眉左侧编排文件编号（五号黑体）。
      source: "10.1.3；附录F 序号47、48"
    - id: GBT-P04
      rule: 页码：目次页到正文首页前用大写罗马数字（Ⅰ 起）；正文首页起用阿拉伯数字（1 起）另编；单数页码在版心右下角，双数页在版心左下角（小五号宋体）。
      source: "10.1.3；附录F 序号48"
    - id: GBT-P05
      rule: 正文首页从单数页开始，格式见图E.3。
      source: "10.1.4"
    - id: GBT-P06
      rule: 末页终结线：最后一个要素内容之下，居中粗实线，长度为版心宽度的四分之一，与最后要素同页。
      source: "10.1.5"

  cover:
    - id: GBT-L01
      rule: 左上第一、二行 ICS 号、CCS 号：上下两行左端对齐（五号黑体）；备案号（行业标准）置于 CCS 号之下另起一行左对齐。
      source: "10.3.1.5；附录F 序号01、02"
    - id: GBT-L02
      rule: 右上第一行文件代号专用美术体字；第二行文件编号四号黑体（代号与顺序号之间空半个汉字，顺序号与年份间一字线连接号）；第三行被代替文件编号五号黑体，在文件编号之下另行编排右端对齐，前置"代替"二字。
      source: "10.3.1.4；附录F 序号03—05"
    - id: GBT-L03
      rule: 封面横幅"中华人民共和国国家标准"：第一行，专用字（黑体风格），一号字级。
      source: "附录F 序号06、07"
    - id: GBT-L04
      rule: 文件名称：一号黑体，位于横幅之下；名称多元素时元素间空一个汉字间隙；文字较多时上下多行编排，行间距 3mm。
      source: "10.3.1.2；附录F 序号08"
    - id: GBT-L05
      rule: 英文译名：文件名称之下，四号黑体；各元素首字母大写其余小写，元素间用一字线连接号。
      source: "10.3.1.2；附录F 序号08（英文译名 四号黑体）"
    - id: GBT-L06
      rule: 一致性程度标识：英文译名之下，加圆括号，四号黑体。
      source: "10.3.1.3；附录F 序号10—13"
    - id: GBT-L07
      rule: 发布日期、实施日期：倒数第二行，四号黑体，左右分置。
      source: "附录F 序号13"
    - id: GBT-L08
      rule: 发布机构：倒数第一行，专用字；两个机构时上下两行堆叠。
      source: "附录F 序号14；图E.5"
    - id: GBT-L09
      rule: 封面右下"发布"：四号黑体，整体一词编排于发布机构之后（保持适当字间距显示，不拆分为单字竖排）。
      source: "附录F 序号09；图E.5"
    - id: GBT-L10
      rule: 封底：右上角文件编号四号黑体，格式见图E.4。
      source: "10.1.5；附录F 序号46"

  front-matter:
    - id: GBT-FM1
      rule: 目次：标题三号黑体居中；内容五号宋体；所列各项上下各空四分之一行顶格起排；第一层次条空一个汉字起排，第二层空两个汉字，依此类推；标题与页码间"……"连接，页码不加括号。目次列表依次包括前言、引言、章编号和标题、条编号和标题（需要时）、附录编号+"(规范性)"/"(资料性)"+标题、附录条（需要时）、参考文献、索引、图编号和图题（含附录中的，需要时）、表编号和表题（含附录中的，需要时）；**在目次中不应列出"术语和定义"中的条目编号和术语**；图或表的目次与其前面的内容之间空一行（渲染执行侧：结构行 + 图/表行自动生成，见 docs/12 §3.35）。
      source: "8.2.2；10.3.2；附录F 序号14、15"
    - id: GBT-FM2
      rule: 前言、引言均另起一面；标题三号黑体居中；内容五号宋体。
      source: "10.3.3；附录F 序号16—19"
    - id: GBT-FM3
      rule: 规范性引用文件清单：各文件空两个汉字起排回行顶格，文件之后不加标点；文件编号或"(所有部分)"与文件名称之间空一个汉字。
      source: "10.3.4"
    - id: GBT-FM4
      rule: 术语和定义：条目编号顶格单独占一行上下无空行；英文对应词在术语之后空一个汉字；其余各项另行空两个汉字起排，定义回行顶格。条目编号与"术语、英文对应词"均为五号黑体、条目内容五号宋体。渲染执行侧（2026-09-11）：术语条目按**两行**排版（编号行顶格 + 术语行空两个汉字，上下无空行，行距同正文），两种抽取形态（`## 3.1.2`+`## 标准 standard` 与段落 `3.1.1`+术语行）在 parser 里归一为同一节点（CSM-OCR-007），见 docs/12 §3.35。抽取执行侧（2026-09-15）：**术语行判据单源** `parser.term_entry_pair`——术语本体可含拉丁缩写/连接号（`SI词头`、`转矩-电流特性线性度`），英文对应词可含逗号等拉丁标点（`International System of Units, SI`），条目的 `term`/`englishTerm` 与目次标签一并回读（此前判据在 parser 与 builder 各写一份且偏窄，条目丢 term/englishTerm、目次只剩条目编号），见 docs/12 §3.60。
      source: "8.7.3.1；10.3.5；附录F 序号22—24"
    - id: GBT-FM5
      rule: 参考文献和索引另起一面，标题居中五号黑体；文献条目空两个汉字起排回行顶格；索引关键词与编号间"……"连接。
      source: "10.3.6；附录F 序号29—32"

  body:
    - id: GBT-B01
      rule: 正式首页：文件名称三号黑体（第一行）；重要提示空两个汉字起排回行顶格（五号黑体）。
      source: "10.1.4；附录F 序号20、21"
    - id: GBT-B02
      rule: 章、条：编号顶格起排，空一个汉字接排标题；编号和标题单独占一行，章上下各空一行，条上下各空半行；章条编号及其标题五号黑体。
      source: "10.2.1；附录F 序号33、34"
    - id: GBT-B03
      rule: 段：空两个汉字起排回行顶格；条文五号宋体。
      source: "10.2.1；附录F 序号34"
    - id: GBT-B04
      rule: 列项：第一层破折号/字母编号空两个汉字起排，文字及回行置版心左边第五个汉字位；第二层间隔号/数字编号空四个汉字起排，文字及回行置版心左边第七个汉字位。marker 与文字之间是版式规定的**固定位置差**（目标位 − marker 宽），渲染用固定字隙（PDF 白色占位字、docx 制表符+制表位）实现，不得用可被两端对齐拉伸的普通空格。
      source: "10.2.2"
    - id: GBT-B05
      rule: 附录：另起一面；附录编号、(规范性)/(资料性)、标题各占一行居中（五号黑体）；附录内容五号宋体。
      source: "10.4.1；9.6.2；附录F 序号25—28"
    - id: GBT-B06
      rule: 图：图编号和图题置于图之下居中（五号黑体），**图编号与图题之间空一个汉字**（10.4.2.1「图编号和表编号之后均应空一个汉字的间隙接排图题和表题」；渲染执行侧：固定字隙哨兵＝一个汉字，见 docs/12 §3.85），上下各空半行；分图编号、分图题小五号黑体；图中数字文字六号宋体；单位陈述在图右上方小五号宋体；**图的转页接排**（续图）每页重复图编号+图题(可选)+"(续)"并重复单位陈述（见 GBT-B13）。
      source: "10.4.2；附录F 序号36—40；9.7.3"
    - id: GBT-B07
      rule: 表：表编号和表题置于表之上居中（五号黑体），**表编号与表题之间空一个汉字**（10.4.2.1；渲染执行侧：固定字隙哨兵＝一个汉字，正表题与续表题注同一判决，见 docs/12 §3.85），上下各空半行；表中各栏单位相同时在表题之下右上方陈述单位（小五号宋体，紧贴表格）；外框线、表头框线、注和表脚注框线均为粗实线；表中数字文字小五号宋体；数字宜居中、同列个位或小数点对齐；相邻相同内容通栏表示不用"同上""同左"；空单元格用一字线连接号；**表的转页接排**（续表）按 GBT-B13 处理（表题不得与表框拆到两页）。
      source: "10.4.2；9.8.4；附录F 序号37—40；9.8.3"
    - id: GBT-B08
      rule: 题注必须形如"表X 题名"/"图X 图题"（编号必备）；无编号且无题名的表格不输出题注行。执行侧（2026-09-24）：题注**以正文可见文字为准**——canonical 的 `**表N 题名**`/`**表N**` 题注行、单位陈述行、图题注 alt 文本优先于指令属性（`caption-number`/`caption`/`unit`），不一致时按可见文字取值并落 `CSM-TABLE-005` 告警（GEN-139，docs/12 §3.88）。
      source: "9.8.2.1、9.7.2.1"
    - id: GBT-B09
      rule: 数学公式另行居中；编号右端对齐与公式间"…"连接；"式中："空两个汉字单独占行，符号解释破折号连接、各行破折号对齐。
      source: "10.4.3"
    - id: GBT-B10
      rule: 注：另行空两个汉字起排，回行与注文字左对齐；"注："/"注×："小五号黑体，注内容小五号宋体；条文脚注空两个汉字起排，文字置版心左边第五个汉字位，分隔细实线长版心宽的四分之一。**"黑体"必须是能与宋体正文一眼分开的字重**：细黑（文泉驿正黑）9pt 实测笔画密度与宋体正文相当（0.209 vs 0.232），markup 换字体而不换字重等于没加黑（用户 2026-09-11 反馈"注：仍没有加粗"）；PDF 标记字体由 profile `fonts.label` 指定（默认思源黑体 Bold，`tools/prepare_label_font.py` 转换，docs/12 §3.35），docx 侧标记 run 用黑体+bold。
      source: "10.4.4；附录F 序号43—45"
    - id: GBT-B11
      rule: 示例：空两个汉字起排，"示例："/"示例×："宜单独占行，回行顶格；区分线框细实线；"示例×："小五号黑体，内容小五号宋体。
      source: "10.4.5；附录F 序号41、42"
    - id: GBT-B12
      rule: 量、单位和符号：变量斜体其他正体；平面角度分秒符号紧跟数值，其他单位符号前空四分之一汉字间隙（渲染以四分之一汉字宽的**固定字隙**实现——按 1/4 字号绘白色占位字，宽度恒为 em/4 且两端对齐不拉伸；紧贴与已有空格一律归一）；% 前不留间隙（GB/T 15835-2011 示例 "34.05%"、"63%~68%"）；分表/分图代号（"表2a"）不插间隙。**执行侧**：行内公式（`$…$`）拍平同样适用——量符号斜体、量符号上的短横线（`\overline`）压字母上方，见 GEN-116。
      source: "10.4.6；GB/T 15835-2011 4.1.1；GEN-116"
    - id: GBT-B13
      rule: 转页接排（图 9.7.3 / 表 9.8.3）：接排的每一页上重复编号、后接题名(可选)和"(续)"或"(第#页/共*页)"（# 为当前页序数、* 为总页数，均用阿拉伯数字）；"（续）"用五号宋体（附录F 表F.1 序号38），编号与题名仍五号黑体；**续表均应重复表头和"关于单位的陈述"**（续图重复"关于单位的陈述"）；题注不得与图/表框拆到两页（渲染端以题注前条件分页保证同页）。渲染落实：完整表头重复（GEN-114 的 header-rows → repeatRows）、`_TrackedTable.split` 插「表N 表题（续）」+「单位为××」行、`_table_caption_keep_height` 防题注孤行——详见 GEN-115。
      source: "9.7.3；9.8.3；附录F 序号38"

fonts-summary:
  note: >-
    字号对照 —— 一号=26pt，三号=16pt，四号=14pt，五号=10.5pt，小五=9pt，
    六号=7.5pt。黑体用于标题类文字，宋体用于内容类文字。完整矩阵见附录F
    表F.1（本文件各规则的 source 已逐条对应其序号）。Linux 渲染实现：
    黑体=wqy-zenhei.ttc，宋体=arphic uming.ttc（受 reportlab 仅支持
    TrueType 轮廓的限制，见通用规则 GEN-070）。
