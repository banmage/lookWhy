# =====================================================================
# 通用规则文件 — 标准文档 PDF 抽取与合成（extraction & synthesis）
# =====================================================================
# 适用范围：任何国家标准类 PDF → Markdown(CSM) → SSIR → PDF 的转换流程。
# 本文件只包含"通用逻辑判断和规则"，不含具体标准的专有内容。
# GB/T 1.1-2020 的标准专属要求见 rules/GB_T_1.1-2020-requirements.yaml。
# 每条规则的 gbt11-ref 字段给出对应的 GB/T 1.1-2020 章节编号以便追溯。
# =====================================================================

meta:
  id: lookwhy.generic-extraction
  version: 1.0.0
  scope: 所有进入本流水线的标准化文件
  conventions: 规则 ID 在处理程序源码中以注释引用；priority must/should/may 对应 GB/T 措辞 应/宜/可；验证时 must 违规即失败，should 记警告；gbt11-ref
    为对应 GB/T 1.1-2020 的章节编号，便于追溯，标注"—"者为工程实践规则、无标准原文对应。
rules:
- id: GEN-001
  stage: extract
  priority: must
  rule: 输入必须是存在的 PDF 文件；不合法时立即报错终止，不得猜测文件名。
- id: GEN-002
  stage: extract
  priority: must
  params:
    default-chunk-pages: 18
  rule: 长文档按固定页数分块（chunk）抽取；每块独立、可重试、可断点续跑。
- id: GEN-003
  stage: extract
  priority: must
  rule: OCR/版面分析的中间产物（content_list.json 等）必须保留在输出目录，后续修复阶段允许回读它们补回被丢弃的信息（如页眉页脚类内容）。
- id: GEN-004
  stage: extract
  priority: must
  rule: 图片、公式等资产以相对路径写入 assets/ 目录；资产引用（assetRef）相对于其所属的中间文档目录解析，最终合并文档中的路径保持可解析。
- id: GEN-005
  stage: merge
  priority: must
  rule: 各块按原始页序合并为单一文档；合并产物携带每块的页码范围标记，以便追溯任意正文片段来自源 PDF 的哪一页。
- id: GEN-010
  stage: merge
  priority: must
  rule: 版面引擎丢弃的页眉/页脚类内容（封面顶部分类号、徽标、底部发布信息）必须从 content_list 回收；回收只依据版面位置与字符类型判别，不依赖任何具体标准的文本内容。
- id: GEN-011
  stage: merge
  priority: must
  gbt11-ref: 10.3.1.5（封面 ICS 号、CCS 号编排）；8.1
  pattern: (?P<k1>[A-Z]{2,4})\s*(?P<v1>\d+(?:\.\d+){0,3})\s+(?P<k2>[A-Z]{2,4})\s*(?P<v2>[A-Z]\s?\d{1,2})
  rule: 分类号行识别：页面顶部区域形如 <字母缩写><编号> 与 <字母缩写><字母+数字> 的单行（分隔空格可有可无），分别提取为两个分类号字段。
- id: GEN-012
  stage: merge
  priority: must
  gbt11-ref: 10.3.1.4（文件编号：代号与顺序号之间空半个汉字，顺序号与年份之间为一字线连接号）
  rule: 文件编号识别：封面顶部形如 <代号>(T|Z)?<连接符><顺序号>—<年份> 的行；代号与顺序号之间、顺序号与年份之间的连接符统一规范化为一字线“—”。
  naming: 输出文件命名方案：标准号中的斜杠一律转为下划线（GB/T→GB_T、JB/T→JB_T、GB/Z→GB_Z、DB11/T→DB11_T、Q/XKBZ→Q_XKBZ、T/CAS→T_CAS），保持与原来编号长度一致；代号与顺序号之间用下划线，年份保留半字线（GB_T_15034-2012、Q_XKBZ_002-2026）。显式指定的输出文件名优先。
- id: GEN-013
  stage: merge
  priority: must
  gbt11-ref: 8.1（封面必备信息含发布日期、实施日期）；附录F 表F.1 序号13（倒数第二行，四号黑体）
  pattern: ^(?P<date>\d{4}-\d{2}-\d{2})\s*(?P<verb>\S{2})$
  rule: 发布/实施日期识别：页 0 上形如 YYYY-MM-DD + 两字动词短语 的行，按动词分别归入发布日期和实施日期。
- id: GEN-014
  stage: merge
  priority: should
  gbt11-ref: 8.1（封面必备信息含发布机构）；附录F 表F.1 序号14（倒数第一行 发布机构）
  rule: 发布机构识别：页 0 上含“发布”字样且非日期的短行；OCR 有损时按已知机构名片段映射回规范名称（映射表是通用机构名录，非针对某份文件的特设文本）。版面引擎把“<机构>发布”拆成两个条目（机构名 footer + 独立“发布”行）时，合并前一条 footer 文本与“发布”后再规范化；机构名不匹配已知名录时保留原文（企业标准 Q/ 的任意公司名亦应解析成功，不得报缺失）。
- id: GEN-015
  stage: merge
  priority: must
  gbt11-ref: 8.1（被代替文件编号应标明）；10.3.1.4（被代替编号另行编排右端对齐，“代替”二字在前）
  pattern: ^代替\s+(.+)$
  rule: 被代替文件编号：页 0 上以“代替”开头的行提取为 replaces 字段。
- id: GEN-016
  stage: merge
  priority: must
  gbt11-ref: 8.1 与 10.3.1.2（国家标准封面应标明文件名称的英文译名）；附录F 表F.1 序号08（英文译名 四号黑体）
  rule: 英文标题识别：按纵坐标排序的页 0 内容中，中文标准名称之后所有连续的仅含拉丁字符的行合并为完整英文标题（名称可能折行或带副题，禁止只取一行）。
- id: GEN-016A
  stage: merge
  priority: must
  gbt11-ref: 10.3.1.1（封面横幅）与 8.1（文件名称）；行业/地方/团体/企业标准横幅无 GB/T 1.1 原文直接对应，按“文件层次/类别字样”类要求执行
  rule: 封面横幅识别与标题区分：封面顶部的横幅行形如 “中华人民共和国国家标准”“中华人民共和国××行业标准”“××省地方标准”“团体标准”“<机构名>企业标准” 等（机构名 + 国家/行业/地方/团体/企业 + “标准”字样，整行匹配）判定为横幅而非文档标题；OCR 在汉字间插入空格时先去除空白再判定。横幅不得作为标题写入 front-matter；标题行（可能是 H1/H2 或裸段落）位于横幅/编号/日期之后、正文要素（前 言/引 言/目 次/数字章/附录）之前。
- id: GEN-017
  stage: merge
  priority: must
  gbt11-ref: 10.3.1.3（一致性程度标识置于英文译名之下并加圆括号）；附录F 表F.1 序号10（一致性程度标识 四号黑体）
  rule: 一致性程度标识识别：页 0 上圆括号包裹且内含国际组织代号（ISO/IEC/EN/ASTM/IEEE…）的行提取为一致性程度声明字段，保留圆括号原文。
- id: GEN-018
  stage: render
  priority: should
  rule: 封面徽标按标准类型从固定目录读取（如 GB_logo.png、JB_logo.png、QB_logo.png、SJ_logo.png、DB_logo.png、T_logo.png、company_logo.png、default_logo.png），不再从 PDF 提取图块作为徽标。类型由 standard-number 前缀决定（最长前缀优先），每类标准一条独立映射，互不影响；映射或文件缺失时回退 default 徽标，再缺失则不绘制。目录与映射由渲染 profile 的 emblems 段声明。
- id: GEN-019
  stage: merge
  priority: must
  rule: 显式提供的 front-matter 值永远优先于自动回收值。
- id: GEN-030
  stage: merge
  priority: must
  gbt11-ref: 9.6.2（附录编号、(规范性)/(资料性)、附录标题各占一行居中）；图E.12
  rule: 附录标题重组：版面引擎常把附录头拆成三个相邻段落（编号行 / (性质) 行 / 标题行）。按“编号行 + 可选括号性质行 + 下一非空行”的形态合并为单一标题；括号全角/半角均接受；性质词枚举：规范性
    / 资料性 / 推荐性。
- id: GEN-031
  stage: normalize
  priority: must
  gbt11-ref: 7.3.2（条编号点分形式）；7.3.1（最多第五层次）；9.6.3.1（附录编号 A.1 形式）；附录A
  pattern: ^\d+(\.\d+){0,4}$ | ^[A-Z]\.\d+(\.\d+)*$
  rule: 层次编号规范化：章条编号必须是阿拉伯数字点分链且最深不超过五层；附录条编号为大写字母点分数字链。文本层损坏型 PDF 会掉点（7.4.2→742、5.10→510）：数字串可经编号连续性约束唯一拆点时自动修复（记录 CSM-OCR-002），无法安全恢复的不猜测、计入报告 issue。标题层级按编号段数规范化（CSM-OCR-006）：MinerU 常把章条标题全部压成同一层 ##，按编号段数提升层级（章 1 段→##、条 2 段→###、子条 3 段→####…），只提升不降低（守护用户手写结构与避免与其他修复冲突），文本不变、roundtrip 三侧一致。
- id: GEN-032
  stage: normalize
  priority: should
  gbt11-ref: 9.7.4.1 与 9.8.4（单位相同时在图/表右上方用“关于单位的陈述”）；附录F 表F.1 序号40（小五号宋体）
  rule: 图/表单位陈述（"单位为…"，9.7.4.1 与 9.8.4）：题注段落内嵌换行的单位陈述拆分为居中题注 + 右对齐单位行；独立成段的单位行且后随表格时折进 table 的 unit 属性、后随图（图片行，可隔一个 ssir:figure 指令行或空行）时折进 figure 的 unit 属性（**图侧单位行必须与图同一组**：否则满页的图另起一面时该行被留在前页末，源文件里它本应是图页第一行）；单位行后不是图/表时保持原样（不折）。渲染为小五号右对齐、位于图/表上方紧贴框线（表的单位行在题注之下）。题注折叠同时防止「表N 题名」+「表N」双题注。
- id: GEN-033
  stage: normalize
  priority: must
  gbt11-ref: 9.7.2.1 / 9.8.2.1（每幅图、每个表均应有编号——无编号者非规范要素，不得输出孤立题注）
  rule: 题注编号：每个表/图必须携带编号（“表 N”/“图 N”）。题注形如“表 N 题名”或仅“表 N”（行业/企业标准常见只编号无题名）均合法，编号必备、题名可省略；OCR 丢失题注行时，从正文最近的前置引用（“应符合表 N 的规定”）推断编号；推断不出时输出孤立题注视为违规并记录。
- id: GEN-034
  stage: normalize
  priority: should
  rule: H1 收敛：正文中除文档主标题外不应再有一级标题；多余的降级处理并在报告记录。
- id: GEN-035
  stage: normalize
  priority: should
  rule: 裸条号标题提升：MinerU 常把章条标题抽成无 ## 前缀的裸段落（编号+标题同段，如 QB_T_2946-2020 第 3 章）。用「祖先链 + 父已提升子级跟随」的级联判定：某编号是已确认标题的祖先后提升为标题，其下子级跟随；全文档无任何已确认标题时完全不提升（保守不猜测），提升记录 CSM-STRUCT-001 warning。防止 GBT-H03 章编号连续性误报与 GBT-C06 把标题当引用条目误报。
- id: GEN-050
  stage: build
  priority: must
  rule: 所有元数据键必须先登记进 schema（schema 声明 additionalProperties 为 false）；新增键未登记时构建必须失败而非静默丢弃。
- id: GEN-051
  stage: verify
  priority: must
  rule: 元数据往返一致：CSM→SSIR→CSM 的身份层字段（标题、英文名、日期、机构、分类号、代替关系、徽标、一致性声明）必须逐字段相等。
- id: GEN-052
  stage: build
  priority: must
  rule: 内容对象（图/表/公式/未知内容）注册表化：正文通过 ref 引用，对象本身带 id 与来源页码；每个 ref 必须能在注册表中命中。
- id: GEN-070
  stage: render
  priority: must
  rule: 字体选择受限于渲染引擎能力：只能注册 TrueType 轮廓的中文字体；OpenType/CFF 字体必须在配置校验阶段报错并给出替代建议。
- id: GEN-071
  stage: render
  priority: must
  rule: 排版参数（字号、边距、行距、对齐）一律来自渲染 profile 文件，源码中不得出现硬编码的中文排版常数；profile 未定义时使用显式默认表。
- id: GEN-072
  stage: render
  priority: must
  rule: 锚定到页面底部的元素（封面发布块、页码、书眉）由页回调绘制，不作为正文流 Flowable；正文流元素随内容流动。
- id: GEN-073
  stage: render
  priority: should
  gbt11-ref: 10.4.2.1（每幅图与其前面的条文、每个表与其后面的条文之间宜空一行）
  rule: 整体性保护：图与其题注、小型表应尽量同页；只有确实放不下的大表才分页，分页时重复表头。
- id: GEN-074
  stage: render
  priority: must
  gbt11-ref: 附录F 表F.1 序号09（封面右下“发布”四号黑体）；图E.5（“发布”整体编排于发布机构之后）
  rule: 词完整性：多汉字词作为一个整体排版，需要视觉间距时用字距（char spacing）实现，禁止插入空白字符或逐字拆分摆放。
- id: GEN-075
  stage: render
  priority: must
  gbt11-ref: 10.3.1.2（文件名称各元素之间空一个汉字的间隙）等“汉字间隙”类规定的实现方式
  rule: 相对定位：元素间的间距用参考元素实测宽度加汉字宽度倍数计算，禁止使用绝对坐标魔法数。
- id: GEN-076
  stage: render
  priority: must
  rule: 渲染完成后自动生成报告：页数、warning 列表、缺失资产列表。
- id: GEN-080
  stage: render
  priority: should
  gbt11-ref: 9.8.4（表内单元格空缺用一字线连接号表示，不得留空格；表格整体为网格结构）
  rule: 表格整行注行跨列合并：OCR 丢失注行（“注：…”）的 colspan 时，若一行只有单个长文本单元格（长度≥20 字）且列数>2，渲染时将该行合并为跨整行（SPAN 0..-1），避免文本挤进单列换行溢出页面。此修复只改变排版，不改变表格内容结构。
- id: GEN-090
  stage: verify
  priority: must
  rule: 每次合成的 PDF 必须做机器验证：文本层抽取后检查关键封面字段齐全、无孤立单字行、页数合理；验证项逐条对应本文件与标准专属规则的 ID。
- id: GEN-091
  stage: verify
  priority: must
  rule: 字体字号验证基于 PDF 内部对象（span 级 font 与 size），而非视觉截图比对。
- id: GEN-092
  stage: extract
  priority: should
  rule: 文本层质量预检：默认 auto 模式下，先用 PDF 文本层抽取检测典型损坏特征——孤立 "4."/"2." 行（条号被拆到独立行，≥30 处）或截断的标准号 "GB/T2423."（≥3 处）——命中即强制改用 OCR 抽取（显式 --method 时尊重用户选择）。已记录的提取方法与当前方法不一致时，失效全部 parts 并删除磁盘上的旧产物后重抽（防止把旧方法抽坏的中间产物当成有效续跑）。抽取后拉丁/数字丢失后验：对比源 PDF 文本层与 raw 的标准号提及数，文本层 ≥5 且 raw 不足一半时判定 MinerU 文本抽取按字体编码丢拉丁整段（"GB/T 1.1—2009"→"/ — "，GB_T_15835-2011/GB_T_23132-2024 类，GEN-092 预检的损坏特征覆盖不到），自动强制 OCR 重抽。
- id: GEN-093
  stage: build
  priority: must
  rule: 文后/前置要素归属：目次、前言、引言、参考文献、索引是文档级要素；扁平树（MinerU 全 ## 抽取）中最后一个附录之后的这些要素不得被并入附录示例内容（附录示例标记只作用于附录内示例块）。
- id: GEN-094
  stage: extract/merge
  priority: should
  rule: 表格块 hybrid-engine 第二遍：MinerU pipeline 的表格结构识别只在可见网格线处断行——\"隐藏行表\"（块内逐行叠印无网格线，GB_T_5171.1-2014 表1 温升限值、GB_T_755-2025 表13 类）被压成单行单元格且数值串粘接不可逆；正文不得整体换 hybrid-engine（VLM 整页正文丢数字/拉丁短串）。extract 阶段对含表页额外跑 hybrid-engine 表格识别，merge 按（页, 页内序）替换 pipeline 表块的行结构、保留 pipeline 指令行（id/题注/编号）、改写 merge 指令的 table 引用；hybrid 缺失/失败/表数不齐时确定性回退 pipeline 表块（不猜测）；content_list 的 page_idx 是相对 invocation 起始页的本地索引，换算全局页号需加 base。该通道默认关闭（hybrid VLM 整页跑耗时）：不加参数时表格保持 pipeline 原样（原始逻辑），仅 --hybrid-tables 显式开启（未开启时丢弃历史 hybrid 结果，防 merge 误用上一轮替换）。
- id: GEN-095
  stage: extract/merge
  priority: should
  rule: 并列版面几何识别（finalize 打标，渲染为无边框定位容器）：同一水平带内 x 分离的 2~3 组内容成组。分片目录名（pages-037-054）换算**绝对页号**作页键——MinerU 分片后每个分片的 page_idx 都从 0 起，按相对页号聚合会把不同分片的同号页混在一起。并列区切分：通栏块（宽 ≥ 版心 62%）、独占一行的「示例N：」题注块、相邻块垂距 > 1.5×行高处断开。锚点块为 image 与 interline_equation（公式对照型，如 GB/T 1.1-2020 9.9.3.1 示例3/4 的「正确/不正确」）；锚点按 x 中心聚类成列（2~3 列，4+ 并排不猜测），区内所有块按 x 中心到各列 x 区间的距离归属列。内容映射：图/公式块按 asset basename 匹配注册表；块文本并入 `inline_equation` span（变量在行内公式 span 里），匹配归一「去 `$` + 破折号族压成单个 `—`」（对齐 CSM-OCR-018 的 SSIR 归一）；文本块只在**锚点所在父节点**内匹配（「正确：」等标签在多处出现，跨节点全局匹配会串组）；已有 sideBySideGroup（canonical `ssir:columns` 手工声明）的内容绝不覆盖。收尾校验：≥2 列各有命中，且每个父节点内命中的内容元素 sortOrder 连续无空洞（否则并列组会被渲染端切成多张表），不满足则整组回滚；同文本内容按行（y 容差 0.6 行高）+ x 顺序对应 sortOrder 序候选（返回下一个未用候选）。已存在组 id 纳入占用集合，新组 id 跳过（重复运行幂等）。纯文本并列（无图/公式锚点）不自动猜测，走手工声明。**几何来源**（`_side_by_side_sources`）：文档根 `parts/` 分片目录与整份文档 `middle.json`（`tools/build_ssir.py` 的 `.json` 输入默认用自身）**合并**使用——合并稿这类「文本来自一侧、公式来自另一侧」的文档只取一侧会丢一半锚点，重复锚点由内容级去重挡住；**锚点内容映射**先按资产 basename，再按 LaTeX（`_latex_key` 去掉全部空白后比对：云端路线没有裁剪图资产，公式块与 SSIR 公式节点都只有 LaTeX）。匹配键归一统一走 `_fold_match_text`（去空白 + 去行内公式定界符 `$` + 全/半角标点折叠 + 行内 LaTeX 字体命令 `\mathrm`/`\text`/… 循环脱壳 + 破折号族压成单个 `—`）——MinerU 几何块与 SSIR 文本在标点宽度、行内公式拼写、破折号长度上可能不同，任一处漏配都会在组内留下 sortOrder 空洞；同一 LaTeX 键可对应**多个** SSIR 节点（排版相同、几何上分处两列的公式），候选按注册表顺序**逐个消费**（取第一个未被占用的节点），一对一映射会让第二个几何块拿不到节点；因 sortOrder 不连续而回滚时输出 `Side-by-side region skipped` 日志（含页号、y、父节点与已命中序号），不静默回滚。
- id: GEN-096
  stage: extract/merge
  priority: should
  rule: 图片占位替代文本不是图题名：MinerU（云端 markdown 尤甚）对没有题注的插图一律写通用占位替代文本（`![image](…)`/`![image1](…)`/`![img](…)`/`![picture](…)`/`![图片](…)`/`![图像](…)`，大小写不敏感），而 CSM 规定图片替代文本必须包含图号和图题（docs/07 §6.5；GBT-B09 图题注、GBT-B12 图编号）——占位串原样进 CSM 会被渲染端当成图题名印出「图 image」。`convert_mineru_markup` 的图片循环里，凡**整行**图片语法且替代文本恰为占位串 → 清为空替代文本 `![](…)`（图片块与资产引用不变）；图片后 6 行内匹配到「图 N 题名」题注行时仍吸附为题注（吸附优先于清空）；真实题名（`![图 1 接线图](…)`、`![接线图](…)`）与行内出现的图片语法一律不动。
- id: GEN-097
  stage: extract/merge
  priority: must
  rule: HTML 行内公式标记不是正文：MinerU 的 HTML 片段用 `<eq>…</eq>` 承载行内公式（内容为 LaTeX 源码），主要出现在表格单元格里（GB/T 10401-2023 表10 的 `<eq>\frac{1}{2}</eq>连续堵转转矩`）。标签被 HTML 解析剥掉后只剩裸 LaTeX 源码，渲染端不识别会把 `\frac{1}{2}` 原样印进 PDF。merge/raw 适配阶段（`convert_mineru_markup` / `html_table_to_csm`）先做一轮 `<eq>…</eq>` → CSM 行内公式 `$…$`（docs/07 §6.6）的确定性转换（内容空白折叠；空公式删除），表格单元格与正文一视同仁；已带 `$…$` 的内容不重复包装。换算到显示文本时（pdf_renderer._latex_to_text / docx 同款）：`\frac{1}{4}`/`\frac{1}{2}`/`\frac{3}{4}` 用分数字形 ¼/½/¾（渲染字体只带这三个分数字形），其余分数（字母、多位、Number Forms 区无字形者）仍拍平为 `(a)/(b)`。

- id: GEN-098
  stage: render
  priority: must
  rule: 图按源版面尺寸还原（不放大原始裁剪图）：提取阶段把每张图在源文档中的版面尺寸（pt）写入 SSIR figure 的 sourceWidth/sourceHeight，渲染端据此缩放（上限版心宽/520pt，不放大）。源尺寸首选源 PDF 的图元矩形（get_image_info，含像素密度回退与封面徽标排除）；raw 起点（MinerU middle.json 输入）无源 PDF 时取图块 bbox——与图元矩形同坐标系，实测偏差 0.2%~5%（块区域含少量留白），量级远小于不回尺寸时的 2~3 倍放大。两者都在场时以源 PDF 为准。取不到尺寸时保持无印记、渲染端按默认尺寸，不猜测。

- id: GEN-099
  stage: extract/merge
  priority: must
  rule: 「一行一条记录」的块不按段落折行拼接：MinerU 的 `ref_text`（参考文献条目）、`index`（目次/索引条目）、`list`（列项）三类块的 `lines[]` 是**记录边界**（一行一条），走 `text` 的「同一段折行直接拼接」规则会把整块粘成一段（`[1] …[2] …`）、条目结构全丢——raw 起点路线据此丢掉 GB/T 1.1-2020 的 18 条参考文献与整段索引。`mineru_middle._rows_markdown` 逐行输出（行内仍按 span 顺序拼接，span 内嵌 `\n` 也算分行；行内拼接与 `_block_lines` 共用 `_line_rows`）；无可输出行时如实记 warning，不静默丢。
- id: GEN-100
  stage: extract/merge
  priority: must
  rule: 图类块按「部件族」处理，不按块名前缀枚举：MinerU 的图块有两族——`image_*`（照片/截图类）与 `chart_*`（整块栅格化的版式示意图，如 GB/T 1.1-2020 图 E.8 目次格式，图体在 `chart_body` 的 span `image_path` 上）。`mineru_middle._figure_inner_role` 按 `*_body` / `*_caption` / `*_footnote` 后缀取部件，`chart` 块与 `image` 块同一处理（题注写进替代文本、脚注排在图后），`chart` span 与 image span 同处理；`image_source_sizes` 把 chart 图块也计入图源尺寸（GEN-098 第二来源）。旧实现只认 `image_*`：整张图连同题注一起被丢（云端路线的图 E.8 即此）。
- id: GEN-101
  stage: extract/merge
  priority: must
  rule: 封面字段按**形态**恢复，不按抽取路线特判（GEN-014 / GBT-C01 的字段清单）：① 分类号两种版式都收——CCS 代号裸写（`A 00`）或带前缀（`CCS A 00`）；ICS 与 CCS 同处一行也能分开取值（`mineru_middle._classification_hints`：ICS 按行内出现取值并剔除，残余里取 CCS 独立词元——前不接字母/数字/斜杠/点、后不接数字，排除页眉里的 `GB`、`GB/T 20001.5—2017` 这类标准代号）；② 发布机构行可能在首页页脚（`discarded_blocks` → `cover_hints`）也可能在正文封面块（`_issuer_from_cover` 扫「<机构A> 发布」行 + 紧随的机构行），两条都交 `_ISSUER_FRAGMENTS` 名录规范化，解析不出就不写（AGENTS §0.3）；③ 英文译名（GBT-C01）按**连续纯拉丁行组**拼接——组内是同一标题的排版折行（空行不切断行组、行尾破折号去掉），组间取最长；取「最长单行」会只留半句（云端把 `Directives for standardization—` 与 `Part 1` 起头的英文标题行拆成相邻两块）；④ `conformity-statement` 取封面块里整行括号包起来的拉丁长句（如 `(ISO/IEC Directives, Part 2, 2018, …, NEQ)`）。

- id: GEN-102
  stage: extract/merge
  priority: must
  rule: 公式 LaTeX 含 CJK 时用图资产渲染（不现场排版）：渲染端公式走 matplotlib MathText，数学字体没有汉字字形，含中文的公式会被替换成一串假字形——GB/T 20001.5-2017 示例1 的「综合差错率 = KC_A…×100%」实测印成方框，而同一块内的 MinerU 裁剪图完好（本地/云端两条路线的 interline_equation span 都常同时带 LaTeX 与 `image_path`）。`mineru_middle._equation_markdown` 判定 LaTeX 含 CJK 字符（含全角标点/假名）且有图资产时，仍输出 **formula 块**但带资产指令（`<!-- ssir:formula asset-ref="…" -->` + `$$LaTeX$$`），保住公式语义（`formula` 节点、公式编号「式(N)」、式中引用、GBT-X06 合规检查）与 LaTeX 原文；渲染端对带 `assetRef` 的公式优先画图（`pdf_renderer` 既有行为）。无图资产时仍输出 LaTeX（不猜测、不丢）。远端 `asset-ref` 由 `tools/build_ssir.py:_materialize_remote_images` 一并下载落地（否则渲染端找不到文件会退回现场排版）。与 merge 阶段「含中文公式保留 asset-ref」的裁定同源。

- id: GEN-103
  stage: render
  priority: must
  rule: 列宽不得窄于「左右边距 + 一个汉字宽」，超宽表整表横排（既不产出非法列宽、也不让负可用宽中止整篇渲染）：① **列宽下界**——`_table_column_widths` 在按需求分配之后对每列施加下界「2×单元格边距(4pt) + 字号」（默认一个汉字宽），不足部分从最宽列按富余量扣减（Σ 恒＝版心）；下界之和 ≥ 版心时退化为等分。列宽小于左右边距时 reportlab 的单元格可用宽为负，会以 `ValueError`（flowable given negative availWidth）中止**整篇**渲染（GB/T 5171.1-2014 表9：26 列、没有表头兜底的末列被算成 0.6pt，04_render 为空、构建退出码 2），任何表都不应产出这种列宽。② **宽表横排**——三条同时成立时把整表（含题注与单位行）旋转 90° 逆时针独占一版：a) 本容器内整表按需排不下（Σ列需求 > 容器宽）；b) 横排可用宽（页面版心高 = A4 高 − 上下边距 − Frame 内衬，模块级 `_ROTATED_TABLE_MEASURE`）能整表按需排下；c) 竖排**不可用**——二选一：i) 竖排列宽分配后仍有**半数以上（且 ≥3）的列被压到下界**（= 左右边距 + 一个汉字宽 → 每行只排得下一个字，读不成表；26 列的 GB/T 5171.1-2014 表9 即此类，竖排 25/26 列在下界）；ii) 竖排网格在本版心内**无法分页**——跨行合并（rowspan）锁定的行组高于一页（`_table_exceeds_frame` 按 reportlab 的**递归**分页语义复算：一次 `split()` 只切出「装得下的第一片 + 其余」，其余那片可以高于一页、会被再切一次，故必须切到不动点仍有一片高于一页才算排不下；只看一级片段会把长表正常分页误判成排不下，2026-09-17 GB/T 30819-2024 表2/表4 即此误判）。表头落订口一侧（左）、文字自下而上、题注排在表上方，与 GB/T 5171.1-2014 表9 的源排版同向；只在正文通栏容器内横排（示例线框内横排会穿出框线）。横排的几何契约——内块（题注/单位行 + 表格）的可用宽**恒定**取 `_ROTATED_TABLE_MEASURE`（不随当前页剩余空间漂移，否则旋转件沿页宽方向的尺寸会随页面位置变化而放不下），`_RotatedTable.split` 在「旋转后的垂直尺寸高于本页剩余高」或「切不出更小片段」时一律返回空列表，让 reportlab 把整表推迟到下一页；返回本页放不下的片段会让 reportlab 抛 `Splitting error(n==2)` **中止整篇**。条件 c) 保证普通「要折行但能分页」的长表不受影响，规则不外溢。

- id: GEN-110
  stage: render
  priority: must
  rule: 表格列宽按**折行代价**分配，不按「自然宽需求」（GBT-B07 执行侧，2026-09-17 用户四条目标）。目标按字典序——① 整表总高度尽可能小；② 折行总次数尽可能少；③ 单元格内容尽量保持完整（尽量不折行）；④ 上述条件下尽量让空白与文字的观感平衡。做法：a) **测量**——每个单元格用**渲染端同一实现**（`_table_cell_flowables`，含 `$…$` 拍平、上下标、表注悬挂、`<br>` 固定断行、表中图按列宽缩放）测出「列宽 → 折行行数」的**折行阶梯**（`_table_cell_ladder`：逐级二分出「降到 k 行所需的最小宽度」，区间随断点收缩、位数自适应、层数上限 24；测量器 `_TableCellMeasurer` 挂在 styles 上作**文档级缓存**，重复单元格与跨表内容命中）；b) **分配**（`_table_column_widths`，总宽恒 = 版心）——从每列下界起步，反复买入「单位宽度换到的收益」最大的一段，收益按字典序比较（整表高度 = Σ各行最高单元格行数×行高 → 折行总行数 → 折行格数），步长取该列阶梯的下一个断点（等于「真正少折一行所需的最小加宽」），同一列内按需增宽度去重、并用「该列剩余折行行数 × 行高 ÷ 代价」的上界剪掉无望的远目标；c) **平衡**（④）——买无可买或版心用尽后的余额按各列当时宽度**比例**分配（各列「空白/文字」比值一致；旧口径的「富余均分」使窄列相对更空，是该列宽反差的主因）；d) 空列保底 floor、每列下界「左右边距 + 一个汉字宽」（GEN-103①）最后统一施加。单元格集合与渲染端同判据：整行通栏（colspan = 全列）与渲染端会 SPAN 成通栏的单长格行不挤占单列；跨列单元格按**组宽**参与测量。旧口径（需求 = 表头自然宽 + 12pt 与数据 80% 分位取大，再「富余均分 / 按数据需求比例分」）不看折行代价——实测 GB/T 30819-2024 表4 把「表头长、数据短」的第 4/5 列撑到 130/94pt（源排版 84/69pt，数据只要 19pt）而表头照样折行，GB/T 1.1-2020 表F.1 第 2 列 112pt（内容 84pt 够）而第 4 列 117pt、折行 8 处。无测量上下文（单表渲染/单测）时按字符宽模型兜底，正文渲染一律真实测量。

- id: GEN-111
  stage: render
  priority: must
  rule: 并列组（`ssir:columns`，示例框内「正确/不正确」对照等）列宽按**各列内容实测自然宽**分配（渲染层，2026-09-17 用户报告）。① **需求测量**（`_flowable_natural_width`）——每列需求 = 该列所有内容「一行自然宽」的最大值：图/公式图用绘制宽（`drawWidth`，与列宽上限收窄同口径），文本段落用 reportlab **自己解析出的片段**（`Paragraph.frags`）按同一字宽表累加（`_markup` 生成的字体切换、上下标缩小字号、黑体标签都算进去——实测「正确：」31.5pt、「dim (能量) = dim (力)×dim (长度)」166.4pt，与渲染出的行宽逐点一致）；② **分配**（`_side_by_side_widths`）——先**等分**（对照型并列的对称性不被内容长短拉偏，GB/T 1.1-2020 9.9.3.1 示例4 的源排版即约 226/235 的近等分），某列需求高于当前宽度时从有余量的列**按余量比例让宽**，直到每列都排得下、或再无可让（Σ需求 > 容器宽时各列同比例欠缺）；总额恒 = 容器可用内容宽（`content_width` − 每列左右 padding 8pt）；③ 显式 `ssir:columns` 的 `widths` 属性优先（沿用比例语义，与 GEN-095 的手工声明一致）；④ 无内容列给 60pt 保底、公式图仍按所在列可用宽收窄（只缩小、保持纵横比，不穿列）。**旧口径**只把图/公式**图片**计入需求，无图列退化成 60pt 占位——GEN-106 拍平成文本的含汉字公式（`dim (能量 ) = dim (力) × dim ( 长度 )`）在示例4 右栏需求为 0 → 列宽 [274.5, 131]pt，而该列一行需 166.4pt，公式被挤成「dim (能量) = dim (力)×(」+「长度)」两行（另一个公式同样），左栏反而空着 100pt+（源排版两栏近等分）。修后两列各 202.8pt，四个并列组（9.9.3.1 示例3/4/5、9.9.3.3 示例3）全部零折行，跨语料页数/警告集不变。docx 侧同源列宽逻辑（`docx_renderer` 只按 `sideBySideWidths` 或均分）未同步（Word 暂停支持中）。

- id: GEN-104
  stage: render
  priority: must
  rule: 上标还原只认抽取里存在的证据，纯数字串不猜（表格单元格/表注的拍平指数还原，GBT-X04 与 GBT-C18 执行侧）。表内拍平指数还原（`_table_cell_superscripts`，PDF/docx 同源）只保留**有证据**的分支——① 单位字母（小写拉丁/希腊）后的显式负号 `−/-` 加数字（s−1→s⁻¹、Ω−1→Ω⁻¹）；② `10` 后跟显式负号（10-2→10⁻²）；③ `10` 后跟 Unicode 上标字形（10²4→10²⁴）；④ 单位字母后平印的 2/3（N/m2→N/m²、cm3→cm³）。原「`10` 后跟 1~3 位纯数字」（1030→10³⁰）的分支**已删除**，因为抽取层对该形态没有任何字号或标签证据（MinerU markdown 不带字号，middle.json 的 span 也不带字号），「10 的正幂」与普通数值完全同形——实测把 GB/T 5171.1-2014 表1 的温度等级 105 印成 10⁵，同族还有 GB_3100-2026 的 `1024 bit` 与 `(π/10800) rad`、GB/T 10401-2023 表内数据 `107`。真正的上标在抽取里带证据（LaTeX `$10^{24}$`、`<sup>` 标签、Unicode 上标字形），走 ③ 或上游既有通道；确被拍平且无证据的真上标**不猜**，按 AGENTS §0.3 记为抽取局限（需要在 canonical 显式写 `$10^{30}$` 或 `<sup>30</sup>` 标记）。

- id: GEN-105
  stage: render
  priority: must
  rule: 公式的显示尺寸按其**目标字号**还原，不把像素当点（GBT-X06 的公式排版执行侧）。引擎生成的 MathText 公式图（`_formula_image`）以 `_FORMULA_IMAGE_DPI` 光栅化、字号 `_FORMULA_IMAGE_EM_PT`（默认 180dpi / 14pt，图上 em = 35px），而 reportlab 的 `Image` 默认把 1 像素当 1pt（72dpi 假设）——直接放置会把公式整体放大 DPI/72 = 2.5 倍，再被宽度上限按内容比例压缩（压缩比随公式长度变化），同一文档内公式字号因此漂移且普遍偏大（GB/T 5171.1-2014 实测式(1) em 17.4pt = 1.66× 正文、式(2) 24.8pt = 2.36× 正文，源版面 313.6/281.1pt 被拉到整个版心 455pt）。放置时必须先按 72/DPI 做单位换算，再归一到文档正文字号（profile `body.size-pt`，`_formula_image_scale`，默认 0.3），之后只保留「容器内容宽 / 140pt 高」的**只缩小**上限；正文公式与并列列内公式两处调用点同规，生成函数与换算常量同源（改 dpi/字号必须同时改常量）。MinerU 公式裁剪图（assetRef）的像素密度不在数据里，暂按原有「只缩小不放大」处理，其按源版面尺寸还原需要源几何印记（与 GEN-098 同族，见 docs/12 §3.56 遗留）。

- id: GEN-106
  stage: render
  priority: must
  rule: 含汉字的公式不得交给 MathText 排版（无图资产时按文本拍平）。MathText 的数学字体只有拉丁/希腊字形，**没有汉字**——含中文的公式源码会被排成一串假字形方框（GB_3100-2026 8.2.3 的「米/秒；米·秒⁻¹；米/秒」实测印成方框，而同一份文档 8.2.2 的英文对应行因带 MinerU 裁剪图正常）。渲染端按此顺序决定：① 可用的图资产（`assetRef`，经 `_resolve_asset` 向上查找，GEN-102）优先画图；② 无可用资产且公式源码含汉字/全角标点（`_latex_has_cjk`）→ **不生成图**，按既有拍平约定渲染为文本（`_latex_to_text`：`\frac{a}{b}`→`(a)/(b)`，汉字由正文宋体印出，保持公式块居中与「式(N)」引导线编号），并在渲染报告记一条 `Formula typeset as text (contains CJK and has no usable image asset)`；③ 其余照旧走生成图。正文公式与并列列内公式两处调用点同规。

- id: GEN-107
  stage: render
  priority: must
  rule: 原样块逐字渲染——保留换行与缩进，不按普通段落拼行（docs/07 §6.10 的 `ssir:unknown` + 围栏代码块，用于树状结构/伪代码/版式片段；GBT-X02 版式保真执行侧）。`_markup` 的常规通道把段内换行连同两侧空白归一为一个空格（CSM §3.3 软换行规则，语料 31 个多行段落依赖它，不能改），原样块必须走独立通道：① 换行 → 硬换行；② 行首空白与行内 ≥2 个连续空白 → 固定字隙（白字哨兵，两端对齐不拉伸），半角空格 0.25em、制表符 4 个半角空格，即 **4 个半角空格 = 1 个全角位**——框线字（│ ├ └ ─，U+2500 区）在 CJK 字体中恰 1em，故树状结构按「每级 4 个半角空格」书写即可与框线对齐；③ 行内单个空格保持原样（长句可折行）；④ 样式为正文号字的左对齐、无首行缩进（`verbatim`），两端对齐不得用于原样块。docx 侧本就按行断行（`splitlines()`），PDF 侧此前缺失。GB_3100-2026 4.1「国际单位制」树即为实例。

- id: GEN-108
  stage: render
  priority: must
  rule: canonical 强调标记按**成对配对**判定并在渲染端落实为字形（docs/07 §6.1；GB/T 20001.10-2014 表1 的字体语义「黑体=必备要素、斜体=资料性要素」即此）。① 判定：星号簇长 1/2/3 = 斜体/粗体/粗斜体，「可开」= 其后首个非空白字符存在且不是 `*`、「可闭」= 其前首个非空白字符存在且不是 `*`，同长度簇就近配对，配对忽略紧邻空白（OCR 常在闭标记前留空格）且强调区两端空白不入强调区；**未成对的星号簇与转义 `\*` 一律按字面星号输出**（负例：GB/T 1.1-2020 9.12.1 的「即 * 、 ** 、 ***」条文脚注星号、9.7.3/9.8.4 的「共*页」与「(第#页/共\*页)」）。旧实现按**邻接字符**（`(?<![A-Za-z0-9])\*+(?![A-Za-z0-9])`）判字面星号，汉字不在 `[A-Za-z0-9]` 内 → 汉字内容的强调标记全部被吞成字面星号；且只有 `**`/`*` 两条正则，`***X***`（粗斜体）无形式（`\*\*(.+?)\*\*` 会把它拆成 `<b>*X</b>*`）。② 字形：粗体 = 黑体（profile `fonts.label`，源文「必备要素」即黑体）、斜体 = 机斜字体资产（profile `fonts.italic`/`fonts.italic-file`，`tools/prepare_oblique_font.py` 按源 PDF 实测 15.8° 生成）、粗斜体 = 黑体粗机斜（`fonts.bold-italic`）；reportlab 的 `<b>`/`<i>` 只从**已注册字族**取成员（未登记时静默忽略，同 GBT-B10「cannot fake bold」），故 `render_pdf` 必须 `registerFontFamily`（normal/bold/italic/boldItalic），且机斜字体资产必须有**独立的 PostScript 名**（reportlab 按 face.name 去重，同名时后注册的机斜字体被丢弃、`<i>` 静默无效）；斜体资产缺失时退回直立字形并在渲染报告记 [GEN-108] 告警（不伪造、不静默）。

- id: GEN-109
  stage: render
  priority: must
  rule: 块级公式按**显示样式**排版——最外层分数用 `\dfrac`（MathText 的样式执行侧；尺寸侧仍按 GEN-105）。canonical 的 `ssir:formula` 对应 LaTeX 的 display math（`$$…$$`），而 MathText 的 `$…$` 等价于**行内（text style）**：`\frac` 的分子/分母被降为脚标号、`\sqrt{…}` 里的分数被压得更扁，块级公式因此读起来偏小（GB/T 1.1-2020 9.9.3.1 示例1「v = l/t」实测分数堆高 12.9pt，而源文同一公式 17.0pt 且分子分母与左侧字母同大；示例5「t_i = √(S_ME,i / S_MR,i)」同）。MathText 不支持 `\displaystyle`，故生成图前把**最外层**的 `\frac` 改写为 `\dfrac`（`_display_style_latex`）：样式降级只由「分数的参数」与「上/下标」触发，花括号只作分组——所以 `\sqrt{\frac{a}{b}}` 里的分数**要**提升；分数参数内与上/下标内的 `\frac` 保持原样式，`\tfrac`（作者显式要求的小分数）与已是 `\dfrac` 的不动。**不放大字号**：em 仍等于正文字号（GEN-105 的换算与 0.3 系数不变），长高只来自分数恢复字号（实测 示例1 17.1→28.2pt 高、示例5 24.6→34.5pt 高、两列内的公式同步长高，无分数的公式逐点不变，em 保持 10.5pt）。生成图的缓存文件名取**提升后**表达式的哈希：否则旧的行内样式图会一直命中缓存，修复对已渲染过的文档不生效。正文公式与并列列内公式两处调用点同规（同在 `_formula_image`）。

- id: GEN-112
  stage: extract
  priority: must
  rule: 图块越界圈入的题注像素不属于图——把图资产裁到题注上边界。MinerU 对同一行的**分图**（GB/T 1.1-2020 9.7.6 的 a)、b)…）常把题注行判成独立的 `image_caption` 内层块，而图块的 `bbox` 下边界会越界圈进这一行（GB_T_30819-2024 4.1.8 图3 的 c 分图实测：图块 y∈[96,312]、题注行 y∈[301,314]，压缩量 11pt）：裁剪图因此把题注的**像素**一起带走，渲染端再按 GBT-B06 排一次题注，图上图下就成了两条同样的「c) Ⅲ型」。判据（只用几何，保守）：题注块与图块**双轴相交**、题注横向至少一半落在图块内、压缩量 > 0 且 < 图块高的三成（防 bbox 异常把整图裁没）；只收**图族**题注（`image_*`/`chart_*` 的 `*_caption` 内层块），表题注与图无关不参与。落地：`mineru_middle.image_caption_bands` 给出「资产文件名 →（图块宽 pt、有效高 pt、压缩量 pt）」；`image_source_sizes` 的高度同步扣掉压缩量（尺寸印记与资产必须同源，否则资产裁短后图被纵向压扁）；`pipeline._trim_figure_caption_bands` 在几何印记阶段把资产裁到目标像素高——目标高由几何与**宽向**像素密度算出（宽不受裁剪影响），只在当前像素高大于目标时裁剪，**幂等**；几何来自 provenance 记录的 middle.json，取不到时报 0、保持原样（不猜）。

- id: GEN-113
  stage: extract
  priority: must
  rule: 图题注归属按**横向几何**判定，整行图的题注摘成独立题注行。MinerU 逐行检出分图题注后按阅读顺序贪心挂块，相邻分图的题注会挂到**别的**图块上、整行图的题注也挂到某一张分图上（GB_T_30819-2024 4.1.8 图3 实测：a 图块挂着「c) Ⅲ型」与「a) 1型」两条，c 图块一条都没有，d 图块多挂「图3 输入端与波发生器凸轮连接方式」）；旧口径只取块内第一条题注，于是 a 图被写成「c) Ⅲ型」、c 图没有题注、「图3 …」整条丢失。判据（只用几何）：① 题注形如「图N 题名」（含附录 `图A.1 题名`）且横向落在本图块内 → 本图的整图题注，照旧写进替代文本（`图2　型号组成示意图` 类）；落在本图块外 → 整行图的题注，摘出来排在**页面最后一个图块之后**输出（源版面在整行图之下）；② 其余题注（分图题注 `a)`/`a）` 等）→ 归给横向重叠最大的图块（重叠 ≥ 题注宽的一半），重叠落在别的图块上时移动过去；没有这样的图块、或本图块/题注缺 bbox 时**保持原位**（不猜）。实现：`mineru_middle._assign_figure_captions`（页级、只移动不删除、按文本去重），`middle_json_to_csm_markdown` 把摘出的题注行排在页面最后一个图块之后。**护栏**：`mineru_html.convert_mineru_markup` 的图片循环向后 6 行前视吸附「图 N 题名」题注行时，题注行的图号与图片替代文本里的图号（`图N`/`图A.1`/分图 `a)`）**不一致则不吸附**（`_figure_number_token`）——否则会把本图已有的题注覆盖掉（GB_T_30819-2024 实测分图 b 的「b) Ⅱ型」被整行题注顶掉；GB/T 1.1-2020 附录 E 实测「图E.4 封底格式」被下一张图的题注顶掉、E.5 那张成空替代文本，新口径与 curated canonical 逐字一致）。替代文本没有图号或图号一致时照旧吸附（后者仍把「图1 题名」规范成「图 1 题名」）。抽到 `a) 1型` 这类 OCR 字形错误（罗马数字 Ⅰ 读成 1）不改写、记抽取局限。

- id: GEN-114
  stage: extract
  priority: must
  rule: 表头行数按**表头区的几何跨度**取值，不写死一行。表头行数 = 首行起点的最大 rowspan（MinerU 的 HTML 用 rowspan 表达表头区：`<td rowspan="2..4">`，即「尺寸代号/参数名称/机座号」这类跨行格覆盖到的行数），下限 1、上限「表格行数 − 1」（至少要留一行数据，否则 reportlab 里 repeatRows == 行数、切点永远落在表头内、表永不可分页）。落地：`mineru_html.html_table_to_csm` 写 `header-rows="N"`（旧实现硬编码 1），`parser` 依此把前 N 行标 `isHeader`，渲染端 `repeatRows`/表头底纹随之覆盖全部表头行。**合并指令的行基准随之统一为绝对 0-based 行号**（`table-merge` 的 `row=0` 即表格第一行、表头行也算在内；旧 builder 用 `data_row = header_rows + row − 1` 的「相对数据行」口径，在 header-rows=1 时与绝对行号恰好重合所以一直没暴露，表头多行时会整体下移 1~3 行、把表头区的跨行格移到数据行上）。既有 canonical 由 `tools/replay_table_header_rows.py` 按同一条规则（从 canonical 自带的 merge 指令取 rowspan，确定性、只改属性值、幂等）回放。

- id: GEN-115
  stage: render
  priority: must
  rule: 表转页接排要补齐续表要项，且表题不得与表格拆到两页（GBT-B13 执行侧）。① **完整表头**：`repeatRows` = 全部表头行（GEN-114 的 header-rows），续表每页重复整块表头；② **续表题注**：每一片续表在重复的表头之上给「表N 表题（续）」，「（续）」用五号宋体（表 F.1 序号 38）、表编号与表题仍五号黑体；③ **单位陈述**：表有单位时续表同样给「单位为××」右对齐小五号宋体（9.8.3 的「续表均应重复表头和关于单位的陈述」）；④ **分页实现**：表对象挂 `_continuation_flowables`（新 Paragraph，不复用正文那两行），`_TrackedTable.split` 给落在下一页的分片在表头行之前插行——插行时行坐标整体下移 K 行（GRID/底纹/SPAN/禁拆命令全部平移，两条插入行各 SPAN 横跨全表），并把该分片的 `repeatRows` 提到「题注 + 单位 + 全部表头行」，使更深的拆分重复整块而不是只重复题注行；⑤ **题注不孤行**：题注/单位行在表前放 `CondPageBreak(题注高 + 全部表头行 + 一行数据)`，剩余高不够时题注与表格一起落到下一页（否则 reportlab 的「不得在表头内切分」规则会把整表推到下一页、题注独留前页）。横排（GEN-103）路径的题注本就在旋转组内，同页性由 `_RotatedTable` 保证。

- id: GEN-116
  stage: render
  priority: must
  rule: 行内公式（`$…$`）拍平成可读文本时必须保住**变量斜体**与**上划线**两条版式约定（GBT-B12 / GBT-X06 执行侧；GB/T 1.1-2020 10.4.6）。① **变量斜体**：基字位置的拉丁/希腊字母用斜体（PDF 侧用 GEN-108 注册的机斜字族 `<i>`）；`\mathrm{}`/`\text{}` 等直立内容、上/下标内容、数字与运算符保持正体；数学算子希腊大写 Δ/Σ/Π/∂/∇ 与 Ω 正体（Ω 在语料内只作单位 MΩ）；**例外**：单字母基字紧跟 `^{…}` 时正体（语料实测这类全是单位幂与 10 的幂——m²/m³/10⁻³⁴；若出现量符号平方需按源版面另立证据）。② **上划线**：`\overline{X}`/`\bar{X}` → 内容 + **矢量短横线**（**不得用字体的组合上划线 U+0304**：CJK 字族该字形 ink 只有 0.268em 宽、纵向落在 0.668–0.717em（em 框顶），与被覆盖字母完全无关——x 高字母（η/n）悬空且只有半个字母宽，cap 字母（P/T/X）正好压进字母顶衬线（实测 GB_T_5171.1-2014 A.2 的 X̄ 整条埋进 X 的顶衬线，用户报「没有任何效果」；GB_T_30819-2024 的 P̄ 报「和文字粘连」）。落地：`_markup` 收尾把区间哨兵换成 reportlab 的 `<u offset=… width=…>`——在**该片段的推进宽**上画一条矢量线（宽度 = 被覆盖 run 的推进宽）；高度 = 被覆盖字符在**其实际字面**里的墨迹高度（fontTools 读 glyf 的 yMax；字面从 `<i>`/`<font name=…>` 标签读出，故希腊字母换拉丁字面（GEN-122）后仍按实际字形定位）+ **0.19em** 间隙；厚度 0.056em；偏移与宽度都写成字号倍数（`*f`），表格式/注文等不同字号下随字号缩放。源版面证据见本条末尾。字形墨迹取不到（未装 fontTools / 非 TrueType 轮廓 / 字形缺失）时按 0.72em 兜底，不猜）。③ **实现顺序**：上划线的区间哨兵与直立遮罩的替换必须在 `_latex_expand_nested` **之前**（它会连命令带花括号拆掉），哨兵 → `<u>` 的转换在**希腊字面替换（GEN-122）之后**（否则量不到希腊字形的墨迹）；斜体化在**拍平当步**完成（区域哨兵只包住该片段），使「数值-单位固定字隙」等后续文本规则看到的仍是原样文本。④ 拍平链路补希腊字母命令 → Unicode 映射（α…ω、Γ…Ψ），否则 `\eta` 这类量符号被当未知命令整条丢弃。⑤ 块级公式的文本回退（无可用图资产 / 含 CJK）走同一条通道。**源版面证据**：GB_T_30819-2024 p25 的 6.4 式中（η/P/n/T 斜体、下标 7.4pt 正体）、**GB_T_30819-2024 p26 式中逐条的短横线是矢量线**（0.558pt 厚 × 4.98pt 长 = 被覆盖字母 n 的推进宽、位于 n 墨迹 0.448em 上方 0.19em = 0.638em；T̄ 为 cap 0.662em + 0.19em = 0.849em）、**GB_T_5171.1-2014 p27（A.2）的 X̄** 短横线位于 X 墨迹上方 0.18em、长 0.57× 字宽、并**居中于字母**、GB_T_5171.1-2014 p10（Δ 正体 + t 斜体、P 斜体 + 下标 N 正体）、GB_T_30819-2024 p17 表6（Φd₁ 的 Φ 与 d 均斜体、下标正体）、GB_3100-2026 p20（m² 基字正体）。docx 侧未同步（Word 暂停支持中），恢复时按本条接回。

- id: GEN-117
  stage: normalize
  priority: must
  rule: 标题（CSM `#` 行）的**编号确认不得依赖编号与标题文字之间的空格**。canonical 里可能出现编号紧贴标题文字的写法（人工 curation / 抽取遗留：`### 6.4分类、标记和编码`、`## 22电磁兼容性`），而渲染端统一写 `6.4 分类、标记和编码`——若解析端只在「编号后有空白」时确认条款编号，缺空格的标题就不算已确认编号，其下**裸条款段**（`6.4.3 产品分类的基本要求如下：`）的级联提升随之失效，同一份文件在回环两侧解析出不同的条款树，报告 C7-clauseIdentifiers / C4-numericalValues 关键信息丢失（GB_T_20001.10-2014 §6.4 实例）。判据与 builder 的标题拆分保持一致：编号后是**空白**，或**直接跟标题文字**（汉字/字母/括号）。**canonical 不需要改写**，渲染产物不变（9 份语料 A/B 解析结果逐节点相同）；只有「编号缺空格 + 其下有裸条款段」的情形会从错误变为正确。受限边界：正文里的裸条款段（非标题行）仍要求编号后为空白（`BARE_HEADING_CANDIDATE_RE`），这类写法语料内未出现，若出现按本条目另立证据。

- id: GEN-118
  stage: render
  priority: must
  rule: 条文脚注的标记形态：正文引用点写 `[foot:N]`（渲染为上标「N)」，与源版面 `1)` 一致），注释文字写成指令对 `<!--ssir:foot:N-->…<!--ssir:/foot-->`（独立成行，落在**引用所在页**的页脚）。canonical 由人工按新规书写（`[^N]` / `[^N]:` 旧写法只报 issue CSM-STRUCT-008、不解析、不留兼容层）；渲染端只认新写法，页脚注文字号按源版面（标记 7.2pt / 注文 9.0pt）。docx 侧未同步（Word 暂停支持中）。

- id: GEN-119
  stage: render
  priority: must
  rule: 表内角标（表注/图表脚注的引用标记）只用通用的 LaTeX 上标 `$^{a}$`、不再使用旧的「行内角标标记」族（`[:sup:a]…[:/sup]` 与自闭合 `[:sup:a/]` 一律退役、**不留兼容层**：遇到只报 issue CSM-STRUCT-009、不解析）。抽取层本就产出 `$^{a、c}$` 形态（GB_T_10401-2023 表注实测），命令族只在测试/文档中出现（语料 0 处）。

- id: GEN-120
  stage: render
  priority: must
  rule: 宽表横排（GEN-103）判据② 是**可行性**而非软需求比较：``列数 × 列下界 ≤ 横排可用宽``（列下界 = 2×单元格边距 + 一个汉字宽，即每行至少排得下一个字）。Σ列**软需求**（表头自然宽 + 12pt/列、数据 80% 分位 + 8pt/列）只作列宽分配的**目标**与判据① 的入口，不得作为横排的否决线：旋转后的列宽与竖排一样是「按可用宽分配 + 折行」得到的（源版面的横排表头本就折行排），多行表头被正确识别（GEN-114，表头行 1→4）后 `header_min` 会显著变大，若拿软需求当否决线，宽表会被误判「旋转后排不下」而从横排退回竖排（GB/T 5171.1-2014 表9：26 列 × 4 行表头，Σ软需求 938.5pt > 横排可用宽 688.2pt，而列下界和 442pt ≤ 688.2pt）。

- id: GEN-121
  stage: render
  priority: must
  rule: 列宽分配的起点 = ``max(列下界, 该列数据需求)``（数据需求 = 该列数据单元格自然宽的 80% 分位 + 8pt 边距；Σ起点 ≤ 版心时生效，否则退回「下界起步」）。折行代价买入（GEN-110）只看「加宽能省下多少行」，从下界起步时，一个「自然需求大、但加宽省不下行数」的列会被饿在下界附近而不必要折行，余量则继续堆到别的列上（GB/T 5171.1-2014 表18：名称列 158.0pt 而源版面 198.5pt、容差列 267.3pt 而源版面 235.5pt；改为数据需求起点后实测 188.7/239.6pt）。**不取表头底线**（表头自然宽 + 12pt）作起点：源版面的长表头本就折行排（GB/T 30819-2024 表4 的表头长、数据短，源版面 84/69pt）。

- id: GEN-122
  stage: render
  priority: must
  rule: 希腊字母从**拉丁字形族**取形，不用 CJK 字族的希腊字形。Noto Serif CJK 把 U+03C6 画成「圆圈 + 贯穿竖线」的全高形（实测 y∈[-215,681]/1000 em，而 x 高只有 516）——小写 φ 读起来就是大写 Φ；reportlab 内置 Symbol 的 φ 也是这一形；DejaVu/Liberation 的拉丁字族给出带尾的小写 φ。源版面（GB/T 5171.1-2014 表18 实测）同一格 `cos` 用正体 E-BZ、`φ` 用**斜体拉丁** E-BX。落地：渲染 profile 声明 `fonts.greek` / `fonts.greek-italic`（+ `-file`，本库用 Times 度量的 Liberation Serif 正体/斜体），`pdf_renderer._markup` 收尾按「希腊字母所在位置」换族——变量位置（`<i>…</i>`，GEN-116 的判定）用拉丁斜体，其余（单位 μ/Ω、算子 Δ/Σ 等）用正体（GBT-B12：变量斜体、其他正体）。未声明该字族时不替换（单表渲染/单测），行为与改动前一致。限制：canonical 里**纯文本**形态的量符号（如表18 的 `cosφ`，无 `$…$`）只换字形、不做斜体——「纯文本里哪一个是量符号」属语义判定，另立规则。docx 侧未同步（Word 暂停支持中）。

- id: GEN-123
  stage: build
  priority: must
  rule: 写回 ``01_extract/<ID>.raw.md`` 的 front matter **必须带 `---` 围栏**。`build_ssir._split_front_matter` 的契约是「返回 FM **正文**、不含围栏」，把它直接与正文拼接写盘会让下游 normalize/parse 以「CSM must start with YAML front matter」（`parser.py:717`）拒收——从 `rawFile/<ID>.md` 或 MinerU `middle.json`（两者都自带 front matter）起步的 raw 起点因此整条断掉（裸 raw 分支用的是自带围栏的 `_build_front_matter`，故只在「已有 front matter 的 raw」上暴露）。落地：`build_ssir._materialize_raw(front_matter_text, body)` 统一补围栏，对已带围栏的输入幂等；两条分支（裸 raw / 既有 front matter）共用。回归夹具 `tests/test_build_ssir.py::RawMaterializationTests`（3 例）。只修围栏丢失，raw 正文不重写。

- id: GEN-124
  stage: parse
  priority: must
  rule: 脚注定义的锚点按**结构**配准，不按标号形状。① **引用点限定在自身节点及其祖先内**（`builder` 的 `node_markers`）：标签跨表/跨章会重号（GB_T_1.1-2020 附录 E 的图注 `a` 与第 6/9 章某表的 `a` 同名），全局 label→锚点表会把远处那张表配给本图的脚注（`anchorKind=tableCell`，脚注被画到别人的表下）。② **无任何文本引用点**的定义（图注编号只画在图内，如 GB_T_1.1-2020 图 E.5~E.7、图 ×）→ 锚点取**结构上紧贴的图元素**：前邻优先、回跳连续的脚注兄弟，无前邻则最近后邻；`anchorKind=figurePart`、`kind=figure`。③ 都没有 → 所在条款节点（`anchorKind=page`，与迁移前一致）。落地 `builder.SSIRBuilder._footnote_anchor` / `_adjacent_figure_anchor`，`footnoteAnchorRef` 与 `notes[].ownerRef`/`anchorKind` 同源判定。回归夹具 `tests/test_footnote_anchor_kinds.py::SameLabelAcrossNodesTests`。

- id: GEN-125
  stage: render
  priority: must
  rule: 框内脚注**不得丢内容**。`ssir:box` 在渲染端落成表格单元格，页脚钩子（`afterFlowable`）在框表内不触发——`anchorKind=page` 的脚注定义落在框内时既排不进页脚、又被整条丢弃（GB_T_1.1-2020「图 ×」的 `b` 定义实测消失）。渲染端改为：框内且 `anchorKind` 不是 `tableCell`/`figurePart` 的脚注定义**就地绘制**（与图表脚注同一小五号原位样式），并如实记录警告；SSIR 的 `notes[]` 不改，只改本页绘制位置。回归夹具 `tests/test_footnote_anchor_kinds.py::BoxedPageFootnoteTests`。

- id: GEN-126
  stage: render
  priority: must
  rule: 「式中」解释组**不得在 markdown 投影里丢失，且必须粘回引入行位置**。`Formula.explanationGroup.items` 挂在公式上，而版面上条目排在紧随公式的的「式中：」引入行**之后**：投影端只写公式本体与编号、不读该字段时整组静默消失（GB_T_1.1-2020 9.9.3.1 示例 1～5 等 5 份文档实测 56 条全丢）；若把条目紧跟公式发射，又会排到引入行之前，读序错。落地：`csm_renderer._render_formula` 暂存条目（`pending_explanation`，同一公式多组累积），`render_content` 遇到 `parser.FORMULA_VAR_INTRO_RE` 命中的引入段后发射，引入行缺失或顺序异常时**立即发射**（宁可就地写出，不丢内容）；条目文本形态复用 PDF 端唯一实现 `pdf_renderer._formula_explanation_lines`（`symbol——definition`，不各写一套）。回归夹具 `tests/test_markdown_projection.py::FormulaExplanationProjectionTests`（2 例：粘回引入行 / 引入行缺失仍发射）；跨语料 9 份文档 56/56 条命中。
- id: GEN-127
  stage: render
  priority: must
  rule: 投影产物的**资产引用按产物所在目录解析**，图必须能在阅读器里打开。SSIR 的 `assetRef` 相对文档根（`assets/…`），而 render.md 落在 `04_render/` 子目录：照抄 `assetRef` 会解析成 `04_render/assets/…`（不存在）——9 份文档 48 条图链接**全部**打不开（用户报告「文档中的图都未显示出来」）。落地：`csm_renderer.asset_base_for(产物路径, 文档根)` 计算相对前缀（`"../"`），`render_csm(..., asset_base=…)` 补前缀；两个写出点统一使用（`pipeline._post_parse_verify_render`、`tools/verify_conversion.py`）；`ssir csm project` 的输出路径未知，保持 SSIR 原值（默认空串）。回归夹具 `tests/test_markdown_projection.py::ProjectionAssetPathTests`（3 例，含「链接可解析到真实文件」断言）；跨语料 48/48 条链接可解析。
- id: GEN-128
  stage: build
  priority: must
  rule: 「式中」组的 `formula=` 声明**不得跨（框, 并列组）作用域归属**。构建端原无条件信任声明 id：声明指向别处的公式时（GB_T_1.1-2020 9.9.3.1 示例 4 的组声明了示例 3 的公式 id `mineru-formula-p037-003`），条目整组挂到错误公式上，PDF 与 render.md 一起错位且无任何记录（实测 PDF 第 46 页：示例 3 印出示例 4 的 E/F/l，示例 4 的「式中：」下空无一物）。落地：`builder` 记录每个公式创建时的（框, 并列组）作用域，`_apply_declaration` 对 `formula-vars` 做作用域校验——声明目标与「结构上紧邻其前的公式」不一致**且不在同一作用域**时，按结构位置归属并记入 `qualityAssessments.comments`；同作用域的显式声明照旧生效（不越界覆盖声明）。已知边界：声明与目标同作用域但不同条款节点时不覆盖（如实记录，不猜）。回归夹具 `tests/test_declaration_directives.py::CrossScopeExplanationTests`（3 例，回退实现即 2 例红）；跨语料 9 份文档仅 GB_T_1.1-2020 的 SSIR/render.md 变化（其余 8 份逐字节不变）、条目总数 13 不变、PDF 页数不变（85）。
- id: GEN-129
  stage: render
  priority: must
  rule: 解释行必须排在引入行之后、且带终结符。「式中」条目挂在公式上，但版面上必须排在紧随其后的「式中：」引入行**之后**；条目文本本身以 `；`/`。` 结尾（源 PDF 第 46 页可验）。原状：整组排在公式处、把「式中：」挤到条目下方，句尾符号随排版一起丢（GB_T_1.1-2020 9.9.3.1 示例 1～5 等，PDF 与投影同错）。落地：`pdf_renderer` 三条发射路径（主序列 / 框内 / 并列分栏每列）统一改为「暂存 + 遇非引入单元 flush」——`_append_content(explanation_sink=…)` 暂存解释行，`_explanation_flowables(pending, …)` 在 `_is_explanation_intro(content)` 命中的引入行之后发射（引入行缺失则就地发射，不丢内容）；行文本由 `_formula_explanation_lines` 给出并**已含终结符**；markdown 投影共用同一判据（GEN-126）。回归夹具 `tests/test_formula_explanation_render.py::FormulaExplanationOrderTests`（顺序断言，PDF 与投影同判据）、`tests/test_markdown_projection.py`（`$v$——速度；`）。
- id: GEN-130
  stage: render
  priority: must
  rule: markdown 子集（CommonMark+GFM）表达不了「只有外框线 / 无框线 / 并排分栏 / 合并单元格」时不得降级内容，另出一份 HTML 结构投影 `04_render/<ID>.render.html` 承载（真实 `<table>`/CSS），`render.md` 保持零 `ssir:` 指令、零 HTML 注释的纯 GFM。HTML 投影必须零**控制符残留**：行内 `$…$` 不得原样出现——数学片段一律经 PDF 端唯一实现 `pdf_renderer._inline_math_markup` 拍平，哨兵（斜体/上下标/上划线）转 HTML 标签（`<i>`/`<sub>`/`<sup>`/`<span class="overline">`），无资产的公式本体同样拍平（不留 LaTeX 命令噪声）；覆盖段落、注/示例/警示、列项、脚注、表题与表单位行、单元格、式中解释行、公式本体。落地：`html_renderer._html_text`（正文统一入口）+ `_math_sentinels_to_tags`；`_esc` 只用于属性与 ``<pre>`` 原样块。已知边界：canonical 里**单个**游离 `$`（如 GB_3100-2026 第 632 行、GB_T_30819-2024 第 953 行的抽取噪声）不是控制符对，按原样字符投影（三份投影一致），不做猜测性删除。落地：`html_renderer.render_html(document, asset_base=…)` 与 markdown 投影同源同判据（同一 `document`、同一 `_project_text`（含 `[foot:a]`→`a)`）、同一资产前缀 `asset_base_for`）；写出点三处一致（`pipeline._post_parse_verify_render`、`ssir csm project`、`tools/verify_conversion.py`）。回归夹具 `tests/test_html_projection.py`（20 例：真实表格与表头、合并单元、占位空单元不张冠李戴、图示资产、示例框与并列分栏、式中组、未知元素、与 md 的内容/顺序同源、行内/单元格/表题/式中行的数学标记与「零 `$`」断言）。
- id: GEN-131
  stage: render
  priority: must
  rule: 表脚注必须排在表框内（表末通栏行），不得排在表格外面。依据 GB/T 1.1-2020 10.4.2.2（表的外框线、表头框线以及表中的注、表脚注所在的框线均为粗实线）与 10.4.4.2（表脚注另行空两汉字起排、置于表的左框线第四个汉字位置）：表脚注在源标准里与表同框（GB_T_1.1-2020 附录 F 表 F.1 的 a)/b)，10401/20001.10/5171.1 同形）。原状：canonical 把 `<!--ssir:foot:X-->…` 定义写在表格块之外（表末行与定义间还隔一个空行），三个渲染端都把 `anchorKind=tableCell` 的脚注当普通段落排在表之后。落地：① canonical 形态——表脚注定义行紧贴表末行（删除其间空行；回放脚本与不变量见 docs/12 §3.80，内容不变）；② 渲染端——PDF 并成表末通栏行（`noteRow`，`colspan=列数`，样式同表内注行：居左、首行空两格、小五号）、markdown 投影成表末行（多注 `<br>` 相连）、HTML 投影成 `<tr><td class="table-note" colspan="N">`；位置由 `notes[].anchorKind == tableCell` 结构化决定（零推断）。回归夹具 `tests/test_table_footnote_placement.py`（5 例：md 表末行且表外不重复 / HTML 表内通栏行 / HTML 角标引用 / PDF 几何断言——注文矩形必须夹在表格框线之间 / 注文不得丢失）。
- id: GEN-132
  stage: extract
  priority: must
  rule: 交给 MinerU 子进程的环境**必须做代理规整**，不得原样继承调用方环境。MinerU 3.x 的 CLI 不直接跑推理：它先起一个本地 mineru-api（`http://127.0.0.1:<随机端口>`）再用 httpx 与它通信；httpx 0.28 在**构造客户端时**就解析环境里每个 `*_proxy` 变量，只接受 http/https/socks5/socks5h 四种方案（`httpx/_config.py` 的 `Proxy.__init__`），其余一律抛 `ValueError`（「Unknown scheme for proxy URL」）——调用方 shell 里一个 `socks://127.0.0.1:7897/`（Clash 等工具设「系统代理（SOCKS）」时的写法）就让整次抽取在启动阶段以 traceback 失败（退出码 1，`parts/` 为空；2026-09-23 用户报告 `tools/mineru_full_standard.py JB_T_14425-2023.pdf`）。落地：`src/leleby_ssir/process_env.py::normalize_proxy_environment(env)` 就地规整交给子进程的 env **副本**（`os.environ` 不动）——① `socks://` → `socks5://`（curl/urllib 同义的 SOCKS5 别名，httpx 只认后者）；② 其余 httpx 不可用的方案（`socks4://`、`ftp://`…）删除该变量并记说明（留着必然崩，删掉只是这一项代理失效；模型已在本地缓存，抽取本身不需要外网）；③ 回环地址（localhost / 127.0.0.1 / ::1）写进 `NO_PROXY`——本地 mineru-api 的通信通道不得经过代理。两个 MinerU 启动点同时接入：`tools/mineru_full_standard.py::_mineru_env()`（extract 与 hybrid 第二遍两处 `subprocess.run`）、`src/leleby_ssir/pdf_extractor.py::_mineru_extract`。注意 urllib 读代理变量时同 scheme **小写名优先**，故同名的大小写两种变量都要各自规整。回归夹具 `tests/test_mineru_process_env.py`（11 例：判据 7 例含合法方案与裸 host:port 原样、大小写保留、NO_PROXY 幂等追加；真实 httpx 构造 2 例——原始 env 抛用户报的那条 ValueError、规整后构造成功；工具层 2 例——`_mineru_env()` 不改 `os.environ`、`extract()` 真的把规整后的 env 传给子进程）。
- id: GEN-133
  stage: normalize
  priority: must
  rule: 目次区段（`目次`/`目 次`/`目录` 标题之后的条目行）**必须被消费掉、不带进产物**：既不落 `ssir:toc` 声明块，也不留在正文，更不得被裸条号提升（GEN-035）当成章标题。现象：MinerU 把目次抽成裸段落行（点线残缺甚至全丢、页码粘连：`5 型式与基本参数2`、`6 技术要求…`），normalize 的裸条号提升把它们当成章标题 → 章树出现两套 1..8、`tocEntries=0` 或为原目次文本、合规报 GBT-H03「章编号不连续」（2026-09-23 JB_T_14425-2023，抽取跑通后暴露）。根因：normalize 没有把「目次区段」这一文档结构事实纳入判据。落地：新增目次区段判据（`TOC_HEADING_TEXT_RE` + `_is_toc_entry_line`/`_toc_region_lines`，均**不依赖导引符**——OCR 会丢点线）：`_parse_body` 写完 `目次` 标题块后消费区段行、不落块、不进正文，丢弃条数写进 warnings；`目次` 标题块**保留**（渲染端 `_toc_nodes`/`toc_story` 以它作为**按章树生成目次**的插入位置——删标题会让生成目次整页消失）。语义修订史：同日 v1 曾把条目折进 `<!-- ssir:toc -->` 声明块（原样保留），用户随后裁定「目次都是根据正文内容生成，而不是根据原来的目次显示（应丢弃）」→ v2 改为丢弃（声明块形态仅对 curated/手写 canonical 里的**显式**声明继续有效，供 GEN-134 回写）；规则实例回放脚本 `tools/replay_toc_sections.py`（对既有 canonical 删除显式声明块或区段行，含内容不变量与幂等断言）。依据 GB/T 1.1-2020 8.2.2（目次由正文结构决定，不列「术语和定义」中的条目编号和术语）与 10.3.2（目次条目不是章条）。
- id: GEN-134
  stage: normalize
  priority: must
  rule: 声明型指令块的**条目体**在重渲染时必须原样回写，不得丢弃。现象：对含 `<!-- ssir:toc -->…<!-- ssir:/toc -->` 的 canonical 跑 `ssir csm normalize`，条目连同配对结束指令整块消失，只剩一个悬空的开指令（GB_3100-2026 的 18 条、GB_T_1.1-2020 的 106 条目次条目全被吃掉）。根因：`csm_normalizer._render_block` 只写出开指令（那一行由通用分支统一输出），没有任何分支处理 `toc`/`figure-legend`/`figure-sub`/`formula-vars` 四种声明型指令（`DECLARATION_DIRECTIVES`）的条目体 → 块体静默丢失；GEN-133 正是要在 normalize 阶段产出这类块，故必须同时修好重渲染（否则规则自相矛盾）。落地：`csm_normalizer._render_block` 增加声明型指令分支——开指令（通用分支）+ 条目行原样 + 配对结束指令 `<!-- ssir:/{name} -->`，重渲染幂等、零内容丢失。回归夹具 `tests/test_toc_section.py::test_declaration_keeps_entries_when_renormalized`（3 条条目逐条断言仍在、结束指令在、区内非空行恰为这 3 条、二次 normalize 该区段逐字节相同）。已知边界（未做，与这两条规则无关）：em-dash 列项被空行打断时（`—— …按照25%、50%、` + 空行 + `75%和100%选择试验点；`）首轮按段落输出、次轮合并为列表块，两轮不完全逐字节相同——最小夹具可复现（无目次、无声明块的文档同样如此），如实记录、未做。
- id: GEN-135
  stage: parser
  priority: must
  rule: 术语条目的「术语行」有三类抽取形态——① 标题 + 标题（`## 3.1.2` + `## 标准 standard`）、② 段落 + 段落（`3.1.1` + `标准化文件 standardizing document`）、③ **标题(纯编号) + 段落**（`### 3.1` + 段落形态术语行，GB_T_5171.1-2014 一类按 3.1/3.2 两段编号列术语的标准）——**三类都必须归一为「编号标题 = 编号 + 术语　英文对应词」**，术语行不得留在正文里。现象：形态③ 未被前两条判据覆盖（既不匹配「标题+标题」也不匹配「段落+段落」），术语行留在正文，SSIR 节点 `title` 为空（`term`/`englishTerm` 虽已配对），渲染端认不出术语条目 → 术语的中英文标题按正文排（**不加黑、不单独占行**，2026-09-23 用户报告 GB/T 5171.1-2014）。根因：`parser._repair_term_entry_headings` 只覆盖前两类形态，且「标题+标题」形态要求编号 ≥3 段，两段编号的术语条目（3.1）整体漏判。落地：① parser 增补形态③ 分支，判据按编号段数分档——**「术语和定义」要素内不限段数**（要素内 3.1/3.2 即术语条目），要素外维持 ≥3 段（避免把普通条的「汉字 + 拉丁」标题误判）；② 渲染端 `pdf_renderer._term_entry_text` 改用 builder 已配对的 `term`/`englishTerm`（只在「术语和定义」内配对，段数不限）优先判据，标题形态判据（≥3 段 + 标题为术语行）作兜底。回归夹具 `tests/test_renderer_term_entries.py::TermEntryMixedFormParserTests`（4 例：形态③ 合并、术语行不再留正文、要素内两段编号标题形态合并、要素外两段编号不合并）与 `::TermEntryShallowNumberPdfTests`（3 例：两段编号术语条目「编号行顶格 85.4 + 术语行空两字 106.4、同为黑体」、术语行不在正文重复、定义段 106.4 随术语条目版式）。
- id: GEN-136
  stage: render
  priority: must
  rule: 表注（表内注与表脚注）**每条注各成一段**，各自「首行空两个汉字」。现象：表脚注以字母标记（`a) …`/`b) …`）彼此相接，只有第一条注的首行带两字缩进，b) 起全部顶格（2026-09-23 用户报告 GB_T_5171.1-2014 表19/表20；实测渲染层 a) x0=100.6 有缩进、e) x0=82.6 顶格）。根因：`pdf_renderer._split_table_note_parts` 只把「注N：」当注起始标记，字母标记族不在判据内 → 整格只出一个段落（`<br>` 相连的 a)~h) 全在同一段里），而「首行缩进」只作用于段首。落地：注起始标记判据补字母族（`_NOTE_PART_START_RE = ^(?:注\s*\d*\s*[:：]|[a-z]\s*[)）])`），`<br>` 之后紧跟注标记处切条、其余 `<br>` 保留为该条注的**注内换行**（不切）；每条注各成一段后由既有表注段落机制给出「首行空两字」。回归夹具 `tests/test_pdf_renderer.py`（3 例：字母标记逐条切分、注内换行保留、无标记多行注不切分——后两例为反向守卫）。依据 GB/T 1.1-2020 10.4.4.2/附录 F 表F.1 表注版式（表注条文空两字）；源 PDF 同条款实测每条注各空两字。 **语义修订（2026-09-24，GEN-137 牵动）**：字母标记族判据放宽为「字母 + 空白」（`[a-z]\s*(?:[)）]|\s)`）并上移为 `parser.TABLE_NOTE_START_RE`（判据单源）——GEN-137 定案图表脚注标记是**裸小写字母**后，`a)` 形态不复存在，沿用旧判据会让切条整体失效、本条当场回归。
- id: GEN-137
  stage: render
  priority: must
  rule: 脚注标记字面按**编号族**分定（GB/T 1.1-2020 9.12.1 / 9.12.2）：**条文脚注**（数字编号）写「N)」上标；**图表脚注**（字母编号）写上标形式的**裸小写拉丁字母**（`a`、`b`、`c`，**不得补半圆括号**），一格多角标按源分隔符连排（`[foot:b、d]` → 上标 `b、d`）。现象：GB_T_10401-2023 表11 第30/31行（振动、冲击）的表注角标被渲染成 `b)d)`、表尾注文行的标记被渲染成 `c)`（2026-09-24 用户报告：「应该是上标 b、d，而不是 b)d)……所有的表注应该都将字符（也可能是数字上标）如此处理」）。根因：渲染端把「脚注标记 = 标号 + 半圆括号」当成唯一形态且三处各写一遍（`pdf_renderer` 的 `"".join(f"\x00SUP\x00{label})\x00/SUP\x00" …)`、`csm_renderer._project_text` 的 `f"{label})"`、`builder` 的 `f"{label}) {text}"`）、注文行行首标记干脆不做上标化；而 9.12.1 明确规定半圆括号只属数字族（「编号形式为后带半圆括号从1开始的阿拉伯数字」），9.12.2 明确字母族是「从『a』开始的上标形式的小写拉丁字母」。落地（判据单源 + 三产物同源）：① `parser.footnote_marker_text` 只对**数字**编号补半圆括号、字母编号原样返回，`footnote_label_marker` 同判据；② 引用点（`pdf_renderer._footnote_cite_supers`，由 `_markup` 统一在最前调用，覆盖单元格/图题/示例框/注全路径）、注文行行首（`pdf_renderer._note_line_marker_supers`、`csm_renderer._strip_footnote_marker_prefix`、`html_renderer._html_note_line`）、定义行（`builder` 的 `textContent`）全部改用该判据；③ markdown 表达不了上标 → 投影**平印字面**（`b、d`），PDF 用 `<super>` 哨兵、HTML 用 `<sup>` 绘成真上标（三份投影同源同一 SSIR）；④ GEN-136 的切条判据随之放宽并单源化（见该条语义修订）。回归夹具 `tests/test_footnote_marker_forms.py`（判据字面族 ×3、markdown 平印、HTML `<sup>`、PDF 文本层「振动b、d / 盐雾c / b分装式… / 1)条文脚注排页脚。 / 无 `b)`、无 `[foot:` 泄漏」）与 `tests/test_footnote_anchor_kinds.py`（表内角标 `径向间隙a、b`、无 `a)` 残留、页脚注数字族仍为 `1)`）；既有夹具按新字面改写（`test_markdown_projection`、`test_html_projection`、`test_table_footnote_placement`）。跨语料 A/B（改动前语义 vs 改动后语义、同一 canonical、逐文档对比三份投影与页数）见 docs/12 §3.84。
- id: GEN-138
  stage: normalize
  priority: must
  rule: 正文**中文语境**的半角标点按中文排版惯例统一为全角形态（2026-09-24 用户裁定：「默认在生成 canonical 时将文档的半角字符替换为全角字符……但是公式或其他需要半角字符的特别情况除外」；判据单源 `parser.normalise_body_punctuation`，normalize 与 parse 同一路径）。现象：源 PDF 与 MinerU 常留半角（`变频电源供电,并可…`、`第1部分:通用技术条件`、`(SAC/TC2)归口`、`80℃,噪声`、表格单元格 `(交流有效值)V`），半角标点与汉字的视觉间隔明显偏小、成品形态与标准原文及中式排版不一致。判据：半角逗号、分号、冒号、问号、叹号、圆括号与句末句号，在**左邻或右邻为汉字或中文（全角）标点**时转全角（成对 `（）`、单个 `，；：？！`）；句号只认**行尾**（其后至行末仅空白）且左邻中文——行中点号可能是引用文件或参考文献条目的分隔点号（GB/T 7714；实测 GB_3100-2026 `国际计量局.国际单位制（SI）…`），局部判据无法与句号区分，宁漏不误改。括号必须成对（栈配对；`(资料性）`、`（A)` 这类混配统一为全角），避免只换一半；链式语境（`(见8.4);` → 先换括号、`）` 成为中文邻居再换其后分号）迭代到不动点（至多 3 轮）。**不转**：front matter（YAML 语法，键冒号必须 ASCII，见 docs/12 §3.86）、`<!-- ssir:…-->` 指令与 `[foot:L]` 标记（CSM 控制字符，全角化会让文件失效）、公式（`$$` 块与行内 `$…$`，掩码跳过）、未知块与围栏块（GEN-052 保留原文）、数字字母单位与千分位小数（`GB/T 1.1-2020`、`1,000`、`1.5`、`m/s`、`80%`）、列表标记（`a)` 由 GBT-C19 单独判据）。载体与 CSM-OCR-004 同集：块文本（段落标题图题注示例与声明型指令条目）、列项条目文本、表格单元格。与 GBT-C19 同规：排版归一**不落 warning**（避免淹没真实告警），命中数由 `tools/replay_body_punctuation.py` 干跑统计。验证：跨语料 A/B 10 份 canonical 共 **750 个载体 / 1900 个字符**差异，折叠全半角后**0 行**内容差异；GB_T_10401-2023 重建后页数 35 对 35、警告 3 对 3、投影行数 1064 对 1064；回归夹具 `tests/test_body_punctuation_width.py` 10 例；全量单测 695 增至 **705 绿**；详见 docs/12 §3.87。

- id: GEN-139
  stage: parse
  priority: must
  rule: 表/图**题注**与**单位陈述**的「可见文字」是人所见即所得的真值，指令属性（`caption-number`/`caption`/`unit`）只是它的投影——两者不一致时以**可见文字为准**（2026-09-24 用户裁定：「表头名应该以文字为准(行优先)，在渲染时如果与属性值不一致，则告警并将属性值替换为与行标题一致，且 json 文件也以行表头填充该值」）。可见文字 = canonical 里的 `**表N 题名**`/`**表N**` 题注行、「单位为毫米」单位陈述行、图题注 alt 文本（`![图 1 电路图](…)`）；唯一落库处 = SSIR `tables[].number/caption/unit` 与 `figures[]`，三视图（pdf/md/html）只读它且**零文本推断**（P0-E），因此判据只在**解析层**落地、渲染期不回写（渲染是纯投影；渲染期写属性会破坏「同源、可重复」，且 verify 是独立程序看不到渲染日志）。判据（`parser._note_caption_attr_conflict`）：① 题注行紧贴表行、或位于指令**上方**（含加粗 `**表N 题名**`/`**表N**` 形态；此前加粗形态不折＝同一题注印两次）→ 折入并**行优先**；属性与之不一致时落 `CSM-TABLE-005` warning（带行号/表 id/属性名/属性值/可见值，`repaired=True`）；② 编号不一致的暂存题注仍**保守不并**（防把正文「见 表5 …」误并进表4），但同样告警（不再静默）；③ 单位陈述行同样行优先 + 告警（表与图同判据）；④ 图题注判据单源 `parser.figure_caption_parts`（2026-09-24 从 builder 移入，避免两处各写一份）。既有产物的文件级对齐走独立回放工具 `tools/sync_table_caption_attrs.py [--apply]`（备份 `.bak-caption-attr`；行数不变 / 只改三键 / 幂等 / 改后 0 告警四重断言；只替换既有属性值，不新增键）。验证：回归夹具 `tests/test_caption_visible_text_wins.py` 11 例；跨语料 11 份 canonical 重 parse，回放前仅 4 处陈旧属性命中（GB_T_1.1-2020 §9.8.2 示例表占位编号 `×`、GB_T_30819-2024 `mineru-table-raw-006/009` 题注属性错位一格），按可见文字回放后 `CSM-TABLE-005` = 0；重建 GB_T_1.1-2020 / GB_T_30819-2024 后 render.md 折叠标点**逐行一致**、页数 85/33 不变、SSIR 表/图/目次（除锚点 id）一致、PDF 文本层题注仍只印一次；全量单测 705 → 716 绿；详见 docs/12 §3.88。

- id: GEN-140
  stage: render
  priority: must
  rule: 角标（上标 `<super>`、下标 `<sub>`、行内数学撇号）与基字符之间**必须留字隙**：**字隙 = max(0, 基字符在角标垂直带内的墨迹超伸) + TeX `\scriptspace`(0.05em)**。现象：GB_T_10401-2023 5.24.2 公式(7) 的参数解释里 `K′` 的右上角标几乎贴住 K、与之重合（2026-09-24 用户报告：「他们需要比目前稍微分开一点点，其他带角标的字符也一样」）。根因（渲染层，非抽取缺陷）：角标自基字符的**推进宽**起点起画，而 reportlab 用的机斜字面（NotoSerifCJKsc-Oblique）拉丁字形墨迹**越过推进宽**——上带（上标/撇号所在，y ≥ 0.45em）K 0.177em、I 0.152em、k 0.117em、T 0.027em，撇号 `'` 的墨迹左边距只有 0.052em，于是「K′」两处墨迹重叠 0.124em（10.5pt 下 1.3pt）；正体字面同位置超伸≈0（宋体 K −0.028em、数字 −0.048em、CJK −0.068em），故缺陷只出现在**斜体变量**之后（表内 `1′`/`30″` 这类紧跟正体数字的角度分秒记号墨迹不撞，不动）。落地：① `_face_band_overhang_em(face, char, band)` 用与渲染同一几何量（fontTools glyf 轮廓点集 + hmtx 推进宽；上带 `(0.45, 4.0)` em、下带 `(−4.0, 0.09)` em，与 reportlab `rise=±0.5em`、字号 ×0.8 的实际落墨范围对应）；② `_script_gap_markup(markup, em_size)` 在 `_markup` **末步**插入（字面标签/强调/上划线均已落定，且插在白字哨兵通道之后，不参与上划线墨迹测量），落墨用白色哨兵字（`_script_gap_html`，推进宽恒等于点数字号，同 `_fixed_gap` 家族技术）；③ 守卫：行首、空白之后、`<br>` 之后无基字符 → 不插；空角标（`^{}` 抽取丢字形态）→ 不插；字面未登记/字形取不到 → 超伸按 0（只留固定字隙，**不猜**）；行内数学撇号只在**作角标**时插（紧跟 GEN-116 判据的斜体变量、其后不是字母数字）——`<super>`/`<sub>` 的闭标签不重置基字符（只有 `<br>` 是行首），使角标内容结束后的下一个角标同判据取值。验证：回归夹具 `tests/test_pdf_renderer.py::ScriptGapTests` 5 例（超伸度量 / 判据值 / 无基字符与空角标反例 / 随容器字号 / 端到端渲染 `K′_Ti` 行的字隙宽度与撇号起点）；既有角标夹具按新形态更新、相关测试类显式固定 math 字面（消除执行顺序影响）；读渲染文本层的脚注夹具改为**按 span 颜色过滤白字占位字形**；跨语料 10 份 docroot 重建（同一 SSIR 另用 HEAD 代码 A/B 对照页数）：9 份页数不变、可见文本 0 diff（只增白字字隙），GB_T_10401-2023 35 → 36 页（角标最多、累计多占 60.5pt 字宽）；全量单测 716 → 722 绿。详见 docs/12 §3.89。

- id: GEN-141
  stage: render
  priority: must
  rule: LaTeX 撇号命令 `\prime` 必须拍成 `′`（U+2032 PRIME），不得当未知命令丢弃：`$K_{Ti}^{\prime}$`（MinerU 的 raw 里数学撇号的标准写法，GB_T_10401-2023 有 6 处）拍平后上标组为空 → 渲染端印不出任何撇号（**内容丢失**），canonical 里人工 curation 成 `K'` 才绕开（同一条公式在两条输入路径下渲染成两种形态）。根因：`_latex_to_text` 的算子/字母映射表没有 `\prime`，该命令落到第 5 步「未知命令整条删除」；次要面是 GEN-116 的「单字母基字紧跟上标（`^{…}`）→ 单位/常数**正体**」例外把撇号也当成幂，基字走正体（源版面是斜体量符号）。落地：① 映射表新增 `(r"\prime", "′")`；② 新增 `_sup_group_is_prime()`，把 GEN-116 的该例外限定为**幂**——上标组内容只是撇号时基字仍按量符号斜体（`$K^{\prime}_{Ti}$` → `<i>K</i>…<super>′</super>`）；③ 空上标组不插角标字隙（GEN-140 内建守卫）。验证：回归 `tests/test_pdf_renderer.py::InlineMathVariableStyleTests::test_prime_command_keeps_the_apostrophe`（拍平结果无 `prime` 残留、`$K_{Ti}^{\prime}$` → 斜体 K + 真撇号上标 + 两段字隙、`m^{2}`/`10^{-3}` 幂形态逐字不变）；跨语料扫描 `\prime` 仅命中 GB_T_10401-2023（raw 6 处、canonical 0 处）。边界（等裁定）：canonical 里 6 处 ASCII `K'` 未改写为 `^{\prime}`（用户偏好不改写 curation 基线），两种撇号字形（全角撇号 vs 上标撇号）是否统一未定。详见 docs/12 §3.90。
- id: GEN-142
  stage: parse
  priority: must
  rule: >-
    式中解释组（`formula-vars`）的条目**只允许 schema 给出的字段**（symbol/definition/unit/terminator；
    ExplanationItem 无 `text`）：
    ① 符号位支持**并列符号**——多个符号共用一条解释、源版面同排一行时（`$D_{I}$ 、 $D_{II}$ ——Ⅰ类、Ⅱ类差错出现的次数…`、
    `$c_{I}$ 、 $c_{II}$  —— I 类、Ⅱ类差错的系数…`），并列写法（`、`/`，`/`,` 连接的符号单元：`$…$` 数学式或
    ≤8 字符且不以标记字符开头的符号）整体原样进 `symbol`；单元自身不得含连接符，使切分确定、无回溯歧义。
    ② 不匹配条目判据的行（取值行/续行，如 `I类使用目的系数： $C_{A}=1$;`、`$c_{I}$ = 3;`、`$c_{II}$ =1。`）
    按**无符号的解释行**登记：`symbol` 置空、整行进 `definition`、句末标点（`；;。`）进 `terminator`；
    **禁止**落 `{"text": …}`（schema 校验会否掉整份文档、构建中断）；渲染端 `symbol or definition` 分支
    原样绘出该行，行序与文字零丢失、不猜符号。
    其余声明类别（figure-legend / figure-sub / toc）的 `text` 回退保持不变（其 schema 允许 `text`）。
  pattern: parser.EXPLANATION_ITEM_RE + builder._unmatched_declaration_item

- id: GEN-143
  stage: extract/merge
  priority: must
  rule: >-
    **扫描页的整页位图不是内容图矩形**：图源尺寸打标（GEN-098）从 `layout.json.imageRects`
    取图候选矩形时，必须剔除**覆盖源页 ≥90%** 的矩形（逐页只有一个图元、尺寸与页等大 =
    源页自身的位图，扫描型 PDF 每页一张）。它参与匹配会同时错在两处：宽高比/密度刚好过得去
    的裁剪图被匹配成整页尺寸；且它的「裁剪图 px ÷ 页位图 pt」会被取成本文档的**像素密度
    回退值**，污染所有未匹配图（SJ_T_11859-2022 实测：Seq0015 命中 595.2x841.7 的页矩形 →
    密度取到 1.60 而非真实的 2.78 = 200dpi/72 → 15/15 张图尺寸放大 1.74 倍，附录 A 并列组
    两列各两张图竖向 792pt > 版心 688pt → 渲染中断）。
    判据：`width ≥ 0.9 × 页宽 且 height ≥ 0.9 × 页高`（页尺寸取自通道 `pages`；页尺寸取不到
    → 无判据，不剔除、不猜）。剔除后同页再无其它矩形时可用的走既有密度回退默认值
    （200dpi/72 ≈ 2.78，与 `mineru_middle.image_source_sizes` 的图块 bbox 同值——两来源
    尺寸必须一致）；只有通道里**一条读数都没有**才提前返回（无判据，不猜）。
  pattern: pipeline._is_page_bitmap_rect + _stamp_figure_source_sizes

- id: GEN-144
  stage: render
  priority: must
  rule: >-
    并列组（`ssir:columns`）必须**整组容纳进版心**，不得因几何超限中断渲染。并列组在渲染端
    落成**单行**表格，reportlab 不能切分单行表格：整组竖向总高超过版心时 `KeepTogether` 把
    它推向新页，新页仍放不下即抛 `LayoutError`（**整份渲染中断**，不是单页降级；SJ_T_11859-2022
    附录 A 一列两张图 792pt > 版心 688pt）。
    判据只用几何：按列可用宽量出各列**非图**内容（题注/标签/文字行）总高与图总高，取
    「最挤的那一列恰好放得进版心 ×0.98」的比例 `min((0.98×版心高 − 该列非图内容高) ÷ 该列图高)`，
    以**同一比例**缩放整组所有图——同比例保证并列对照的相对大小不变（各列独立缩放会让并列
    关系失去可比性）；非图内容不缩放。比例 < 0.2（非图内容本身已超版心）时退化为**上下
    排布**（内容零丢失、顺序不变）；两种情形各记 warning，均不抛异常。文档上下文之外
    （版心高未写入）不做任何事（同 `_table_caption_keep_height` 约定）。
  pattern: pdf_renderer._fit_side_by_side_to_frame + _append_side_by_side

- id: GEN-145
  stage: build/render
  priority: must
  rule: >-
    **显式文档框（`ssir:box`）是自包含文档框**：框内标题不得与外层层级竞逐。
    现象（GB_T_20001.5-2017 附录 A「示例很多没有正确显示」）：示例文档自带的章条标题
    （`## 5 系统结构`、`## 6.1 数据采集处理`）与正文章号同形同层，按层级栈一律弹到
    文档根 → 成为附录的**兄弟**节点，而框外题注「示例 1:」（H4、附录条的子节点）拿不到
    框内容 → 渲染成「附录条 + 六个题注（先）→ 六个示例线框（后）」，题注与线框脱节。
    判据：框开标记处的**最近结构节点**即框内容锚点（通常是题注），框内标题按**框内自身
    层级栈**归位、整块挂锚点之下；框内标题不弹/不推外层层级栈，也不推进附录作用域
    （框是自包含文档，其内部章号不属外层附录）。框关闭时把框内**末节点**交回层级栈，
    使框后引导段维持「框内容 → 引导段 → 下一题注」的文档顺序（与改动前对同一段的归属
    一致）。锚点为「框开标记处最近结构节点」——框开在同一条款正文中途（前面无新标题）
    时锚点即该条款，行为与旧实现一致。
    渲染端：题注（`exampleContent` + 无框 + 「示例N：」题注 + **子节点带框**）按
    `example-label`（框外题注、黑体顶格）排，题注子内容的**首个带框节点**按
    `example-title`（黑体居中，示例文档真实标题）排；顶层题注分支与递归分支同判据。
  pattern: builder（box_scope：锚点/框内层级栈/末节点回栈）+ pdf_renderer._append_marked_node（题注样式与首节点 example_leading）

- id: GEN-146
  stage: build
  priority: must
  rule: >-
    标题的**条号拆分**：编号后必须接**空白**，或紧贴**汉字/括号**（MinerU/curation 丢间隔的
    「5要求」「6.4分类、标记和编码」仍拆条号，GEN-117 容错保留）；数字**紧贴拉丁字母**是
    **量值+单位/标识**形式（`1000kV`＝一千伏、`5mm`），**不拆条号**——条号与标题之间按
    GB/T 1.1 空一个间隔，与 parser `BARE_HEADING_CANDIDATE_RE`（编号 + 空白 + 汉字/括号）
    同源。反例：`## 1000kV变电站监控系统  技术规范`（人工 curation 把源文的
    「1 000 kV 变电站监控系统 技术规范」的千分位/单位间隔抹掉）曾被拆成章号 `1000` +
    标题 `kV变电站监控系统`，渲染成带编号的章标题（左对齐）且进目次/大纲，而源文该行是
    示例文档标题（居中、无编号）。
  pattern: builder._make_node（numbered 判据）

- id: GEN-147
  stage: build
  priority: must
  rule: >-
    **表合并指令的锚点必须是"有文字的那一行"**：`ssir:table-merge` 的 `row` 是**绝对**
    0-based 表格行号（表头行也算在内），它绑定的是"当时的表格行";canonical 的表格行被
    编辑过（去掉跨页重复表头行、增删数据行）后行号即失效——锚点落到**空白续行**上，
    带内的真实文字会被并合掉。现象（GB_T_20001.5-2017 表1 实测）：`规范性一般要素`
    `规范性技术要素` 在渲染产物里整体消失（渲染文本零命中）、后组标签挤到前一组的行上，
    用户读表即发现"第三行没显示、后面行错位"。判据：竖直合并（rowspan>1）的锚点单元为空、
    且 `[row, row+rowspan)` 内同列存在有文字的单元 → 锚点陈旧。修正是**确定性**的：
    ① 带整体上移到最近一个同列有文字的组标签行（表头区不参与，不越出表头）；
    ② 下界收窄到"下一个同列有文字的行"之前（绝不把别的组标签并进来）；
    ③ 重锚后两条指令重叠 → 不动、如实登记；指令行越界 → 丢弃并如实登记；
    ④ 带内同列没有任何文字（真正的空合并单元）→ 保持原样（不猜）。
    重锚与越界都写入 `qualityAssessments[].comments`（"Realigned table merge directives: …"），
    并把表标为 `partiallyPreserved`（越界情形），供人工复核必要时同步修正 canonical 行号。
  pattern: builder._table + builder._realign_vertical_merge
