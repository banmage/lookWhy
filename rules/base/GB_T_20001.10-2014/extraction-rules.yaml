# =====================================================================
# GB/T 20001.10-2014 通用抽取规则 — 产品标准类文件的抽取与合成专项
# =====================================================================
# 来源：《标准编写规则 第10部分：产品标准》（GB/T 20001.10-2014）
# 用途：产品标准类文件在通用抽取规则（GB_T_1.1-2020/extraction-rules.yaml
#       GEN-xxx）之上叠加的专项抽取/合成规则。规则 ID 前缀 P10-GEN-；
#       源码中以 "P10-GEN-xxx" 注释引用。
# 适用判定：文档为产品标准时（封面/范围含"产品标准"表述，或 front-matter
#       document-type/product-scope 标注）加载本规则包。判定逻辑见
#       compliance.py is_product_standard()。
# priority 措辞分级与 GB/T 一致：must=应、should=宜、may=可。
# =====================================================================

meta:
  id: lookwhy.product-standard-extraction
  version: 1.0.0
  applies-to: product-standard
  note: >-
    本规则包只记录产品标准特有的抽取与合成差异，不重复 GB/T 1.1-2020
    的通用要求。验证顺序：GEN-* → GBT-* → P10-* / P10-GEN-*。

rules:
- id: P10-GEN-001
  stage: merge
  priority: must
  gbt11-ref: 5.4（要求）；GB/T 1.1-2020 7.3.1（条编号点分形式）
  rule: 产品标准的"要求"章下无编号的小节标题（如"通用要求""箱体""性能"）是产品分类条目的标题，抽取时不得丢失标题层级；其后紧跟的编号条（4.1.1 等）仍按点分编号保留。标题与编号条之间的隶属关系由版面顺序决定，不按文本猜测。
- id: P10-GEN-002
  stage: merge
  priority: must
  gbt11-ref: 5.6（试验方法）与 5.4（要求）一一对应；GB/T 1.1-2020 7.3.2（条编号点分形式）
  rule: 试验方法章（第 N 章）的条编号应与要求章（第 M 章）的条编号镜像（如 6.3 对 7.3、5.5.2 对 4.7.2）；抽取后验证编号镜像关系，不一致时计入报告 issue（P10-R03 的机器检查）。
- id: P10-GEN-003
  stage: merge
  priority: should
  gbt11-ref: 5.4.4（定量要求给出数值与单位）
  rule: 要求章中的定量指标（数值 + 单位，如 "不大于 100 N·m"、"40 HRC~50 HRC"）抽取时必须保留数值与单位之间的连接符（≤、~、～）原文，禁止归一化或丢单位；OCR 将单位错拼为相似字符（N·m 与 N.m）时按常用单位表校正并记录。
- id: P10-GEN-004
  stage: normalize
  priority: must
  gbt11-ref: 5.6.2（试验方法与要求编号呼应）
  rule: 试验方法条的内容是方法描述（"使用硬度仪检测…""由伺服电机控制…"），不是要求条款；normalize 阶段不得把它们当作要求型条款做措辞检查，也不得因方法描述含"应"字误报。
- id: P10-GEN-005
  stage: normalize
  priority: should
  gbt11-ref: 5.7（检验规则：检验分类、检验项目与判定规则）
  rule: 检验规则章常见结构为"检验分类 / 出厂检验 / 型式检验"小节；抽取后按此结构识别小节标题并保留。出厂/型式检验的项目列表（a) b) c)…）保留列项层级。
- id: P10-GEN-006
  stage: render
  priority: must
  gbt11-ref: 5.4（要求章）；GB/T 1.1-2020 10.4.2（表题）
  rule: 产品标准的"要求"章常含性能指标表（表头"零件/指标"，内容为数值+单位）；渲染时表头行加粗/底纹遵循通用渲染规则，表内数值与单位不得折行断开。
- id: P10-GEN-007
  stage: render
  priority: should
  gbt11-ref: 5.8（标志、标签、包装、运输、贮存）
  rule: 标志/包装章常含引用性条文（"符合 GB/T 191 规定的标志图形"）与包装清单列项；渲染时保留列项符号（a) b)…）与引用的标准编号，引用编号不得被误判为条款编号。
