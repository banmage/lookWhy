schema-version: "1.0"
kind: rendering-profile
id: GB_T_1.1-2020
version: "0.2.0"
status: draft
title: GB/T 1.1-2020 标准文件 PDF 渲染配置
description: >-
  SSIR 到传统 A4 PDF 的初始渲染配置。用于稳定生成适合审阅的标准文稿；
  字体与字号遵循 GB/T 1.1-2020 附录F（规范性）的规定：
  标题、目次/前言标题、章条编号及标题、图/表编号和表题用黑体；
  正文、注、脚注、示例用宋体。字号按附录F：封面文件编号四号（14pt）、
  封面文件名称一号（26pt）、三号标题（16pt）、五号正文（10.5pt）、
  小五号注与脚注（9pt）、图中文字六号（7.5pt，表格内近似执行）。
page:
  size: A4
  margin-mm: {top: 25, bottom: 25, left: 28, right: 22}
fonts:
  primary: WenQuanYiZenHei
  primary-file: /usr/share/fonts/truetype/wqy/wqy-zenhei.ttc
  # 正文宋体：思源宋体（Noto Serif CJK SC，大陆标准字形，全角标点贴底）。
  # 系统自带的是 CFF 轮廓的 .ttc（reportlab 无法加载），本 profile 使用
  # otf2ttf 转换后的 TrueType 版（tools/prepare_serif_font.py 一键生成）。
  body: NotoSerifSC
  body-file: config/rendering/fonts/NotoSerifCJKsc-Regular.ttf
  # 注/示例标记（「注：」「注1：」「示例：」「示例1：」）：附录 F 表 F.1 序号 42/44
  # 要求小五号**黑体**，且要与宋体正文一眼可分。primary（文泉驿正黑）是**细黑**，
  # 9pt 下笔画密度与宋体正文相当（换字体不换字重看不出加黑），故标记单独用黑体粗：
  # 思源黑体 Bold（同为 CFF 轮廓的 .ttc，otf2ttf 转换后使用，
  # tools/prepare_label_font.py 一键生成）。留空则退回 primary。
  label: NotoSansCJKsc-Bold
  label-file: config/rendering/fonts/NotoSansCJKsc-Bold.ttf
  # 强调字形（docs/07 §6.1 CSM 强调标记；GEN-108）：`**X**`→黑体（同 label）、
  # `*X*`→宋体机斜、`***X***`→黑体粗机斜。reportlab 的 <b>/<i> 只能从**已注册
  # 字族**取成员（未登记时标签被静默忽略），故强调必须有真实字形资产：两份机斜
  # 由 tools/prepare_oblique_font.py 由上两行字体按剪切矩阵生成（倾斜角取自源
  # PDF 实测 15.8°，GB_T_20001.10-2014 表1「目次」）。文件缺失时退回直立字形
  # 并在渲染报告记 [GEN-108] 告警。
  italic: NotoSerifCJKsc-Oblique
  italic-file: config/rendering/fonts/NotoSerifCJKsc-Oblique.ttf
  bold-italic: NotoSansCJKsc-BoldOblique
  bold-italic-file: config/rendering/fonts/NotoSansCJKsc-BoldOblique.ttf
  # 希腊字母字形族（GEN-122）：CJK 字族把 U+03C6 画成「圆圈 + 贯穿竖线」的全高形，
  # 小写 φ 读起来像大写 Φ；源版面（GB_T_5171.1-2014 表18）用拉丁斜体。希腊字母改从
  # 拉丁字族取形：greek 正体（单位 μ/Ω、算子 Δ/Σ）、greek-italic 斜体（变量位置，
  # GBT-B12）。Liberation Serif 为 Times 度量，与源版面的拉丁字形最接近。
  greek: LiberationSerif
  greek-file: config/rendering/fonts/LiberationSerif-Regular.ttf
  greek-italic: LiberationSerif-Italic
  greek-italic-file: config/rendering/fonts/LiberationSerif-Italic.ttf
styles:
  body: {size-pt: 10.5, leading-pt: 18, first-line-indent-em: 2, alignment: justify}
  section: {size-pt: 16, leading-pt: 22, alignment: center}
  clause: {size-pt: 12, leading-pt: 20, alignment: left}
  front-matter: {size-pt: 10.5, leading-pt: 18, alignment: justify}
  # 前言/引言/目次等前置标题：三号（16pt）黑体居中（GBT-FM2）。
  front-matter-title: {size-pt: 16, leading-pt: 22, alignment: center}
  table: {size-pt: 9, leading-pt: 15}
  # 示例线框（GBT-B11，GB/T 1.1 10.4.5 区分线框细实线）：frame=黑色细实线框；
  # shaded=浅色背景（类代码块）。单条示例可用 SSIR 节点 exampleStyle 覆盖。
  examples: {style: frame}
header-footer:
  footer-page-number: true
  footer-format: "第 {page} 页"
  header-standard-number: true
tables:
  repeat-header-rows: true
  grid-width-pt: 0.5
  header-background: "#F2F2F2"
figures:
  missing-asset: placeholder
formulas:
  fallback: raw-text
# 封面徽标（GEN-018/GBT-L02 文件代号美术体字）：按标准类型从固定目录读取，
# 不再使用从 PDF 提取的 coverBadge 图块。mapping 的 key 是 standard-number
# 前缀（最长匹配优先），每类标准一个独立条目与独立图形文件；新增类型只需
# 加一条映射并放入对应 <prefix>_logo.png，不影响其他类型。目录相对本 profile
# 文件解析；文件缺失回退 default，再缺失则不绘制徽标。
emblems:
  directory: ../emblems
  default: default_logo.png
  mapping:
    # 国家标准（强制性 GB / 推荐性 GB/T / 指导性 GB/Z）
    "GB/T": GB_logo.png
    "GB/Z": GB_logo.png
    "GB": GB_logo.png
    # 行业标准（按行业代号前缀）
    "JB": JB_logo.png
    "QB": QB_logo.png
    "QC": QC_logo.png
    "SJ": SJ_logo.png
    "DL": DL_logo.png
    "NY": NY_logo.png
    # 地方标准
    "DB": DB_logo.png
    # 团体标准
    "T/": T_logo.png
    # 企业标准
    "Q/": company_logo.png
