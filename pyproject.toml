[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leleby-ssir"
version = "0.1.0"
description = "Canonical SSIR Markdown to SSIR JSON parser"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.0",
]

[project.scripts]
ssir = "leleby_ssir.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
leleby_ssir = ["ssir.schema.json"]

[tool.setuptools.packages.find]
where = ["src"]
