[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leleby-ssir"
version = "0.1.0"
description = "Canonical SSIR Markdown to SSIR JSON parser"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.0",
  "reportlab>=4.0",
  "PyMuPDF>=1.23",
  "flask>=3.0",
  "mineru[core]>=1.0.0",
  "torch>=2.0",
  "torchvision>=0.15",
  "httpx[socks]>=0.27",
]

[project.scripts]
ssir = "leleby_ssir.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
leleby_ssir = ["ssir.schema.json"]

[tool.setuptools.packages.find]
where = ["src"]
